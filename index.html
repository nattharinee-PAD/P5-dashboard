<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>P5 ระบบพัฒนาบุคลากร PKG</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap');

/* === CSS RESET (ทำเอง ไม่ใช้ Tailwind) === */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }

:root {
  --bg-main: #0A0E1A;
  --card-bg: rgba(255, 255, 255, 0.04);
  --card-bg-solid: #161F30;
  --border-slate: rgba(255, 255, 255, 0.08);
  --border-glow: rgba(167, 139, 250, 0.4);
  --text-primary: #FFFFFF;
  --text-secondary: #94A3B8;
  --text-mute: #64748B;
  --neon-purple: #A78BFA;
  --neon-cyan: #60A5FA;
  --neon-magenta: #F472B6;
  --neon-mint: #34D399;
  --neon-purple-dim: rgba(167, 139, 250, 0.15);
  --neon-cyan-dim: rgba(96, 165, 250, 0.15);
  --neon-magenta-dim: rgba(244, 114, 182, 0.15);
  --neon-mint-dim: rgba(52, 211, 153, 0.15);
  --neon-yellow: #FACC15;
  --neon-green: #10B981;
}

body {
  font-family: 'Sarabun', 'Inter', sans-serif;
  background-color: var(--bg-main);
  color: var(--text-secondary);
  position: relative;
  overflow: hidden;
}

/* === Glow Effect (ม่วง + ฟ้า ที่มุมจอ) === */
body::before {
  content: '';
  position: fixed;
  top: -20%; left: -10%;
  width: 70%; height: 70%;
  background: radial-gradient(circle, rgba(167, 139, 250, 0.4), transparent 60%);
  filter: blur(100px);
  z-index: 0;
  pointer-events: none;
  animation: float1 18s ease-in-out infinite;
}
body::after {
  content: '';
  position: fixed;
  bottom: -20%; right: -10%;
  width: 70%; height: 70%;
  background: radial-gradient(circle, rgba(96, 165, 250, 0.35), transparent 60%);
  filter: blur(100px);
  z-index: 0;
  pointer-events: none;
  animation: float2 22s ease-in-out infinite;
}
@keyframes float1 {
  0%,100% { transform: translate(0,0); }
  50% { transform: translate(5%, 4%); }
}
@keyframes float2 {
  0%,100% { transform: translate(0,0); }
  50% { transform: translate(-4%, -3%); }
}

/* === Layout === */
.app {
  position: relative;
  z-index: 1;
  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* === Sidebar === */
.sidebar {
  width: 288px;
  background: linear-gradient(180deg, #0F1729 0%, #0B111E 100%);
  border-right: 1px solid var(--border-slate);
  box-shadow: 4px 0 30px rgba(0, 0, 0, 0.5);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  z-index: 10;
}
.sidebar-brand {
  padding: 16px 20px;
  background: linear-gradient(90deg, rgba(180, 123, 255, 0.08), transparent);
  border-bottom: 1px solid var(--border-slate);
  display: flex; align-items: center; justify-content: space-between;
}
.logo-p5-text {
  font-size: 1.2em; line-height: 1.2;
  font-weight: 800;
  letter-spacing: 0.1em;
  color: var(--neon-purple);
  text-shadow: 0 0 20px rgba(180, 123, 255, 0.4);
}
.role-selector-wrap {
  padding: 12px 24px;
  background: rgba(11, 17, 30, 0.6);
  border-bottom: 1px solid var(--border-slate);
  display: flex; align-items: center; justify-content: space-between;
  font-size: 0.75em;
}
.role-selector-wrap > span { color: var(--text-mute); }
.role-selector-wrap select {
  background: rgba(22, 31, 48, 0.8);
  border: 1px solid var(--border-slate);
  color: var(--text-primary);
  border-radius: 6px;
  padding: 4px 8px;
  outline: none;
  cursor: pointer;
  font-size: 0.9em;
  font-family: inherit;
}
.role-selector-wrap select option {
  background: #0F1729;
  color: var(--text-primary);
}

.sidebar-menu {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
}
.sidebar-menu::-webkit-scrollbar { width: 6px; }
.sidebar-menu::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.2); border-radius: 3px; }

.menu-section-title {
  color: var(--text-mute);
  letter-spacing: 0.1em;
  padding: 8px 16px;
  margin-top: 8px;
  font-size: 0.7em;
  font-weight: 700;
  text-transform: uppercase;
  display: flex; align-items: center;
}
.menu-section-title i { margin-right: 8px; }

.menu-item {
  width: 100%;
  background: transparent;
  border: none;
  border-left: 3px solid transparent;
  color: var(--text-secondary);
  padding: 12px 16px;
  border-radius: 8px;
  font-size: 0.95em;
  font-family: inherit;
  text-align: left;
  cursor: pointer;
  transition: all 0.25s ease;
  display: flex; align-items: center;
}
.menu-item i.fa-solid { width: 24px; text-align: center; margin-right: 12px; font-size: 1.05em; }
.menu-item:hover {
  background: rgba(180, 123, 255, 0.06);
  color: var(--text-primary);
}
.menu-item.active {
  background: linear-gradient(90deg, rgba(180, 123, 255, 0.15), rgba(180, 123, 255, 0.04));
  color: var(--neon-purple);
  border-left-color: var(--neon-purple);
  font-weight: 600;
  box-shadow: inset 0 0 20px rgba(180, 123, 255, 0.05);
}

.menu-subitem {
  width: 100%;
  background: transparent;
  border: none;
  color: var(--text-mute);
  padding: 8px 16px 8px 48px;
  border-radius: 6px;
  font-size: 0.85em;
  font-family: inherit;
  text-align: left;
  cursor: pointer;
  transition: all 0.25s ease;
  display: flex; align-items: center;
}
.menu-subitem:hover {
  color: var(--text-primary);
  background: rgba(180, 123, 255, 0.05);
}
.menu-subitem.active {
  color: var(--neon-cyan);
  background: rgba(0, 224, 255, 0.08);
  font-weight: 600;
}
.menu-subitem .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: currentColor;
  margin-right: 12px;
  opacity: 0.6;
}
.menu-subitem.active .dot {
  background: var(--neon-cyan);
  box-shadow: 0 0 8px var(--neon-cyan);
  opacity: 1;
}

.sidebar-footer {
  padding: 16px;
  text-align: center;
  font-size: 0.7em;
  color: var(--text-mute);
  background: rgba(0,0,0,0.3);
  border-top: 1px solid var(--border-slate);
}

/* === Main Content === */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}
.top-header {
  height: 64px;
  background: rgba(11, 17, 30, 0.6);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border-slate);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 32px;
  flex-shrink: 0;
}
.top-header h2 {
  font-size: 1.25em;
  font-weight: 700;
  color: var(--text-primary);
}
.user-info { text-align: right; }
.user-name { color: var(--text-primary); font-size: 0.875em; font-weight: 600; margin: 0; }
.online-status {
  color: var(--neon-mint);
  font-size: 0.75em;
  display: flex; align-items: center; justify-content: flex-end;
  margin-top: 2px;
}
.online-dot {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--neon-mint);
  box-shadow: 0 0 8px var(--neon-mint);
  margin-right: 4px;
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

.main-view {
  flex: 1;
  overflow-y: auto;
  padding: 32px;
  position: relative;
  z-index: 1;
}
.main-view::-webkit-scrollbar { width: 8px; }
.main-view::-webkit-scrollbar-track { background: var(--bg-main); }
.main-view::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.2); border-radius: 4px; }

/* === Glow Card (Glass Effect ตามภาพ) === */
.glow-card {
  background: var(--card-bg);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  border: 1px solid var(--border-slate);
  border-radius: 16px;
  position: relative;
  overflow: hidden;
  transition: all 0.3s ease;
  box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
}
.glow-card:hover {
  border-color: var(--border-glow);
  transform: translateY(-2px);
  box-shadow: 0 12px 40px rgba(167, 139, 250, 0.15);
}

/* === KPI Grid === */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 24px;
  margin-bottom: 32px;
}

/* === KPI Card === */
.kpi-card {
  padding: 16px 20px;
}
.kpi-card::after {
  content: '';
  position: absolute;
  top: -50%; right: -20%;
  width: 120px; height: 120px;
  border-radius: 50%;
  filter: blur(40px);
  opacity: 0.6;
  pointer-events: none;
}
.kpi-card.purple::after { background: var(--neon-purple); }
.kpi-card.cyan::after { background: var(--neon-cyan); }
.kpi-card.magenta::after { background: var(--neon-magenta); }
.kpi-card.mint::after { background: var(--neon-mint); }

.kpi-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
  position: relative; z-index: 2;
}
.kpi-label { color: var(--text-secondary); font-size: 0.875em; font-weight: 500; }
.kpi-icon {
  width: 44px; height: 44px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.1em;
}
.kpi-icon.purple { background: var(--neon-purple-dim); color: var(--neon-purple); box-shadow: 0 0 16px rgba(167, 139, 250, 0.4); }
.kpi-icon.cyan { background: var(--neon-cyan-dim); color: var(--neon-cyan); box-shadow: 0 0 16px rgba(96, 165, 250, 0.4); }
.kpi-icon.magenta { background: var(--neon-magenta-dim); color: var(--neon-magenta); box-shadow: 0 0 16px rgba(244, 114, 182, 0.4); }
.kpi-icon.mint { background: var(--neon-mint-dim); color: var(--neon-mint); box-shadow: 0 0 16px rgba(52, 211, 153, 0.4); }

.kpi-value {
  font-size: 2.25em;
  font-weight: 800;
  color: var(--text-primary);
  line-height: 1.1;
  position: relative; z-index: 2;
}
.kpi-unit {
  font-size: 0.65em;
  font-weight: 500;
  color: var(--text-secondary);
}
.kpi-trend {
  font-size: 0.75em;
  margin-top: 6px;
  position: relative; z-index: 2;
}
.kpi-trend.purple { color: var(--neon-purple); }
.kpi-trend.cyan { color: var(--neon-cyan); }
.kpi-trend.magenta { color: var(--neon-magenta); }
.kpi-trend.mint { color: var(--neon-mint); }

.kpi-progress {
  width: 100%;
  height: 6px;
  background: rgba(0, 0, 0, 0.3);
  border-radius: 3px;
  margin-top: 12px;
  overflow: hidden;
  position: relative; z-index: 2;
}
.kpi-progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--neon-mint), var(--neon-green));
  box-shadow: 0 0 10px var(--neon-mint);
  border-radius: 3px;
  transition: width 0.8s ease;
}

/* === Workflow Panel === */
.workflow-panel { }
.workflow-head {
  padding: 16px 20px;
  background: rgba(180, 123, 255, 0.05);
  border-bottom: 1px solid var(--border-slate);
  display: flex; justify-content: space-between; align-items: center;
}
.workflow-head h3 {
  font-size: 1.05em;
  font-weight: 700;
  color: var(--text-primary);
  display: flex; align-items: center;
}
.workflow-head h3 i { color: var(--neon-purple); margin-right: 8px; }
.realtime-badge {
  background: var(--neon-mint-dim);
  color: var(--neon-mint);
  border: 1px solid rgba(74, 222, 128, 0.3);
  font-size: 0.75em;
  font-weight: 500;
  padding: 4px 10px;
  border-radius: 20px;
  display: inline-flex; align-items: center;
}
.realtime-badge .blink {
  width: 6px; height: 6px;
  background: currentColor;
  border-radius: 50%;
  margin-right: 6px;
  animation: pulse 1.5s infinite;
}

.table-wrap { overflow-x: auto; }
.workflow-table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
}
.workflow-table th {
  background: rgba(11, 17, 30, 0.5);
  color: var(--text-mute);
  border-bottom: 1px solid var(--border-slate);
  padding: 16px;
  font-size: 0.7em;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.workflow-table td {
  color: var(--text-secondary);
  border-bottom: 1px solid var(--border-slate);
  padding: 16px;
  font-size: 0.875em;
}
.workflow-table tbody tr { transition: background 0.2s ease; }
.workflow-table tbody tr:hover { background: rgba(180, 123, 255, 0.04); }
.wf-id { color: var(--text-primary); font-weight: 600; }
.wf-title { color: var(--text-primary); }
.wf-date { color: var(--text-mute); }

.status-badge {
  display: inline-flex; align-items: center;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 0.72em;
  font-weight: 600;
}
.status-badge.approved { background: var(--neon-mint-dim); color: var(--neon-mint); border: 1px solid rgba(74, 222, 128, 0.3); }
.status-badge.pending  { background: rgba(250, 204, 21, 0.12); color: var(--neon-yellow); border: 1px solid rgba(250, 204, 21, 0.3); }
.status-badge.draft    { background: rgba(148, 163, 184, 0.1); color: var(--text-secondary); border: 1px solid var(--border-slate); }
.status-badge i { margin-right: 6px; font-size: 0.85em; }

/* === Form Pages === */
.form-page { max-width: 672px; }
.form-page .workflow-head { display: block; }
.form-page .workflow-head h3 { font-size: 1.125em; margin-bottom: 4px; }
.form-page .workflow-head .desc { font-size: 0.75em; color: var(--text-mute); margin-top: 4px; }
.form-body { padding: 16px 20px; }
.form-body .space-y > * + * { margin-top: 16px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.form-field label {
  display: block;
  font-size: 0.875em;
  font-weight: 500;
  color: var(--text-primary);
  margin-bottom: 6px;
}
.form-field input,
.form-field textarea,
.form-field select {
  width: 100%;
  background: rgba(11, 17, 30, 0.6);
  border: 1px solid var(--border-slate);
  color: var(--text-primary);
  border-radius: 8px;
  padding: 10px 14px;
  outline: none;
  font-family: inherit;
  font-size: 0.875em;
  transition: border-color 0.2s ease;
}
.form-field input:focus,
.form-field textarea:focus,
.form-field select:focus {
  border-color: var(--neon-purple);
}
.form-field input:disabled {
  background: rgba(11, 17, 30, 0.4);
  color: var(--text-secondary);
  cursor: not-allowed;
}
.form-field textarea { resize: vertical; min-height: 100px; }

.form-actions {
  padding-top: 16px;
  border-top: 1px solid var(--border-slate);
  display: flex; justify-content: flex-end; gap: 12px;
}
.btn {
  padding: 10px 20px;
  font-size: 0.875em;
  font-weight: 500;
  font-family: inherit;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s ease;
  display: inline-flex; align-items: center;
}
.btn-cancel {
  background: transparent;
  color: var(--text-secondary);
}
.btn-cancel:hover { background: rgba(148, 163, 184, 0.08); }

.btn-submit {
  background: linear-gradient(135deg, var(--neon-purple), var(--neon-magenta));
  color: white;
  box-shadow: 0 0 16px rgba(167, 139, 250, 0.5);
}
.btn-submit:hover { box-shadow: 0 0 24px rgba(167, 139, 250, 0.7); }

.btn-save {
  background: linear-gradient(135deg, var(--neon-cyan), #0099CC);
  color: white;
  box-shadow: 0 0 16px rgba(96, 165, 250, 0.5);
}
.btn-save:hover { box-shadow: 0 0 24px rgba(96, 165, 250, 0.7); }

.placeholder-wrap { text-align: center; padding: 48px 24px; }
.placeholder-icon {
  width: 64px; height: 64px;
  border-radius: 50%;
  background: var(--neon-purple-dim);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 16px;
  font-size: 1.2em; line-height: 1.2;
  color: var(--neon-purple);
}
.placeholder-wrap h4 { color: var(--text-primary); font-size: 1em; font-weight: 600; margin-bottom: 4px; }
.placeholder-wrap p { color: var(--text-mute); font-size: 0.875em; max-width: 384px; margin: 0 auto; }

/* === Blank Card === */
.blank-card {
  padding: 32px;
  text-align: center;
  max-width: 448px;
}
.blank-card .icon { color: var(--text-mute); font-size: 2.25em; margin-bottom: 12px; display: block; }
.blank-card h3 { color: var(--text-primary); font-weight: 700; margin-bottom: 4px; }
.blank-card p { color: var(--text-mute); font-size: 0.875em; }

/* === Fade-in === */
.fade-in { animation: fadeIn .4s ease; }
@keyframes fadeIn { from {opacity:0; transform:translateY(8px);} to {opacity:1; transform:translateY(0);} }

/* === Responsive === */
@media (max-width: 1024px) {
  .kpi-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 768px) {
  .sidebar { width: 240px; }
  .kpi-grid { grid-template-columns: 1fr; }
  .main-view { padding: 16px; }
  .top-header { padding: 0 16px; }
  .form-row { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="app">
  <!-- ========== SIDEBAR ========== -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div>
        <div class="logo-p5-text">P5 ระบบพัฒนาบุคลากร PKG</div>
      </div>
    </div>

    <div class="role-selector-wrap">
      <span><i class="fa-solid fa-user-shield"></i> สิทธิ์ผู้ใช้งาน:</span>
      <select id="roleSelector" onchange="changePermission(this.value)">
        <option value="Admin">Admin (เห็นทั้งหมด)</option>
        <option value="Manager">Manager</option>
        <option value="Member">Member (ทั่วไป)</option>
      </select>
    </div>

    <nav id="dynamicMenu" class="sidebar-menu"></nav>

    <div class="sidebar-footer">&copy; 2026 PKG All Rights Reserved.</div>
  </aside>

  <!-- ========== MAIN ========== -->
  <main class="main">
    <header class="top-header">
      <h2 id="currentPageTitle">Dashboard</h2>
      <div class="user-info">
        <p class="user-name" id="userDisplayName">ผู้ดูแลระบบ (Admin)</p>
        <p class="online-status">
          <span class="online-dot"></span> Online
        </p>
      </div>
    </header>

    <section id="mainView" class="main-view"></section>
  </main>
</div>

<script>
// ============================================================
// 1. โครงสร้างข้อมูลเมนูแบบ Dynamic
// ============================================================
const menuData = [
  { id: "m1", title: "Dashboard", icon: "fa-chart-pie", permissions: ["Admin", "Manager", "Member"] },
  {
    id: "m2", title: "Training", icon: "fa-graduation-cap", permissions: ["Admin", "Manager", "Member"],
    subMenus: [
      { id: "m2_1", title: "2.1 ลงทะเบียนหลักสูตร", permissions: ["Admin", "Manager", "Member"] },
      { id: "m2_2", title: "2.2 ขอเปิดอบรม ภายใน/ภายนอก", permissions: ["Admin", "Manager"] },
      { id: "m2_3", title: "2.3 ส่งผลอบรม ภายใน/ภายนอก", permissions: ["Admin", "Manager", "Member"] },
      { id: "m2_4", title: "2.4 รายงานการอบรมภายนอก", permissions: ["Admin", "Manager"] }
    ]
  },
  {
    id: "m3", title: "Mentor", icon: "fa-user-group", permissions: ["Admin", "Manager"],
    subMenus: [
      { id: "m3_1", title: "3.1 Set ระบบพี่เลี้ยงน้องเลี้ยง", permissions: ["Admin"] },
      { id: "m3_2", title: "3.2 แบบ From การส่งรายงานน้องเลี้ยง PKG", permissions: ["Admin", "Manager"] }
    ]
  },
  {
    id: "m4", title: "Coach", icon: "fa-chalkboard-user", permissions: ["Admin", "Manager", "Member"],
    subMenus: [
      { id: "m4_1", title: "4.1 Menter Coach เชื่อมสมุดพก", permissions: ["Admin", "Manager"] },
      { id: "m4_2", title: "4.2 อื่นๆ", permissions: ["Admin", "Manager", "Member"] }
    ]
  },
  {
    id: "m5", title: "Roleplay", icon: "fa-masks-theater", permissions: ["Admin", "Manager", "Member"],
    subMenus: [
      { id: "m5_1", title: "5.1 รายงานการ Roleplay", permissions: ["Admin", "Manager"] },

let currentRole = "Admin";
let activeMenuId = "m1";

let workflowData = [
  { id: "WF-001", type: "ขอเปิดอบรมภายใน", title: "หลักสูตร Service Excellence", requestBy: "สมชาย มีสุข", date: "2026-06-15", status: "Pending" },
  { id: "WF-002", type: "ส่งผลอบรมภายนอก", title: "อบรมเทคนิคยานยนต์ไฟฟ้า", requestBy: "วิชัย รวยเจริญ", date: "2026-06-14", status: "Approved" },
  { id: "WF-003", type: "รายงานน้องเลี้ยง PKG", title: "ประเมินผลรอบ 1 เดือน - ณัฐพล", requestBy: "พี่เลี้ยงสมศักดิ์", date: "2026-06-12", status: "Draft" }

// ============================================================
// 2. Render Sidebar Menu
// ============================================================
function renderMenu() {
  const menuContainer = document.getElementById('dynamicMenu');
  menuContainer.innerHTML = '';

  menuData.forEach(menu => {
    if (!menu.permissions.includes(currentRole)) return;

    const hasSubs = menu.subMenus && menu.subMenus.filter(s => s.permissions.includes(currentRole)).length > 0;
    const wrapper = document.createElement('div');

    if (!hasSubs) {
      wrapper.innerHTML = `
        <button onclick="navigateTo('${menu.id}', '${menu.title}')" class="menu-item ${activeMenuId === menu.id ? 'active' : ''}">
          <i class="fa-solid ${menu.icon}"></i>
          <span>${menu.title}</span>
        </button>
      `;
    } else {
      let subsHtml = '';
      menu.subMenus.forEach(sub => {
        if (!sub.permissions.includes(currentRole)) return;
        const isSubActive = activeMenuId === sub.id;
        subsHtml += `
          <button onclick="navigateTo('${sub.id}', '${sub.title}')" class="menu-subitem ${isSubActive ? 'active' : ''}">
            <span class="dot"></span>
            <span>${sub.title}</span>
          </button>
        `;
      });
      wrapper.innerHTML = `
        <div class="menu-section-title">
          <i class="fa-solid ${menu.icon}"></i> ${menu.title}
        </div>
        <div>${subsHtml}</div>
      `;
    }
    menuContainer.appendChild(wrapper);
  });
}

// ============================================================
// 3. Router
// ============================================================
function navigateTo(menuId, menuTitle) {
  activeMenuId = menuId;

  renderMenu();

  const view = document.getElementById('mainView');
  switch(menuId) {
    case 'm1': view.innerHTML = renderDashboardView(); break;
    case 'm2_1': view.innerHTML = renderSimpleFormView("ฟอร์มระบบลงทะเบียนหลักสูตรอบรม", "กรุณากรอกข้อมูลหลักสูตรที่ต้องการลงทะเบียนเรียนเพื่อสะสมทักษะ"); break;
    case 'm2_2': view.innerHTML = renderWorkflowFormView("แบบฟอร์มขอเปิดอบรม (ภายใน/ภายนอก)", "ขอเปิดอบรมภายใน"); break;

    case 'm3_2': view.innerHTML = renderWorkflowFormView("แบบฟอร์มการส่งรายงานน้องเลี้ยง PKG", "รายงานน้องเลี้ยง PKG"); break;
    case 'm4_1': view.innerHTML = renderTableView("ระบบ Mentor Coach เชื่อมโยงสมุดพกพัฒนาตนเอง", "บันทึกข้อมูลการ Coaching และดึงคะแนนเชื่อมตรงสู่สมุดพกรายบุคคล"); break;
    case 'm4_2': view.innerHTML = renderBlankCardView("ฟังก์ชันอื่นๆ ของระบบการ Coach"); break;

    case 'm5_2': view.innerHTML = renderSimpleFormView("แบบฟอร์มบันทึกผลและส่งคลิป/คะแนน Roleplay", "กรอกผลการทดสอบการจำลองบทบาทและบันทึกคะแนนเข้าสู่ระบบประเมินผล"); break;
    case 'm6_1': view.innerHTML = renderTableView("รายงานวิเคราะห์ทุนการศึกษาและงบประมาณการอบรมองค์กร", "ตรวจสอบการใช้งบประมาณพัฒนาทรัพยากรบุคคลและภาระผูกพันทุนองค์กร"); break;
    case 'm6_2': view.innerHTML = renderBlankCardView("ฟังก์ชันอื่นๆ ของระบบกำกับทุนองค์กร"); break;
    default: view.innerHTML = renderDashboardView();
  }
}

// ============================================================
// 5. Helpers
// ============================================================
function getStatusBadge(status) {
  if (status === 'Approved') {
    return `<span class="status-badge approved"><i class="fa-solid fa-circle-check"></i> อนุมัติแล้ว</span>`;
  } else if (status === 'Pending') {
    return `<span class="status-badge pending"><i class="fa-solid fa-circle-notch fa-spin"></i> รอพิจารณา</span>`;
  } else {
    return `<span class="status-badge draft"><i class="fa-solid fa-circle-minus"></i> ร่างแบบฟอร์ม</span>`;
  }
}

function changePermission(role) {
  currentRole = role;
  const names = { 'Admin': 'ผู้ดูแลระบบ (Admin)', 'Manager': 'ผู้จัดการฝ่าย (Manager)', 'Member': 'สมาชิกทีม (Member)' };
  document.getElementById('userDisplayName').innerText = names[role];
  activeMenuId = "m1";
  document.getElementById('currentPageTitle').innerText = "Dashboard";
  renderMenu();
  navigateTo('m1', 'Dashboard');
}

function handleSubmitWorkflow(event, type) {
  event.preventDefault();
  const titleInput = document.getElementById('formTitle').value;
  const newId = "WF-0" + (workflowData.length + 1);
  workflowData.unshift({
    id: newId, type: type, title: titleInput,
    requestBy: document.getElementById('userDisplayName').innerText,
    date: "2026-06-16", status: "Pending"
  });
  alert("ส่งข้อมูลเข้าสู่กระบวนการอนุมัติ (Workflow) เรียบร้อยแล้ว!");
  navigateTo('m1', 'Dashboard');
}

// ============================================================
// 6. Init
// ============================================================
renderMenu();
navigateTo('m1', 'Dashboard');
</script>
