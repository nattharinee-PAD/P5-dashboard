<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P5 Dashboard · Self-contained (v7 — Open Directly)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
/* (Same CSS as share.html) */
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap');
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }

:root {
  /* 🎨 Rainbow Palette (from sample image) */
  --bg-main: #F9FAFE;             /* Light blue-white background */
  --card-bg: #FFFFFF;              /* White card */
  --border-slate: rgba(15, 23, 41, 0.08);
  --border-glow: rgba(255, 165, 0, 0.3);
  --text-primary: #0F1729;         /* Dark text */
  --text-secondary: #475569;
  --text-mute: #94A3B8;
  
  /* 5 Rainbow colors (Ribbon 01-05) */
  --c1-orange: #FF8C00;            /* Ribbon 01: Orange */
  --c2-green: #22C55E;             /* Ribbon 02: Green */
  --c3-blue: #3B82F6;              /* Ribbon 03: Blue */
  --c4-purple: #9333EA;            /* Ribbon 04: Purple */
  --c5-pink: #EC4899;              /* Ribbon 05: Pink/Red */
  
  /* Legacy aliases (mapped to rainbow) */
  --neon-purple: #9333EA;          /* = c4 */
  --neon-cyan: #3B82F6;            /* = c3 */
  --neon-magenta: #EC4899;         /* = c5 */
  --neon-mint: #22C55E;            /* = c2 */
  --neon-orange: #FF8C00;          /* = c1 */
  
  /* Status colors (rainbow version) */
  --status-green: #22C55E;
  --status-yellow: #F59E0B;
  --status-red: #EF4444;
}

body {
  font-family: 'Sarabun', 'Inter', sans-serif;
  background-color: var(--bg-main);
  color: var(--text-secondary);
  position: relative;
  overflow-x: hidden;
  min-height: 100vh;
}

body::before {
  content: '';
  position: fixed; top: -20%; left: -10%;
  width: 70%; height: 70%;
  background: radial-gradient(circle, rgba(255, 140, 0, 0.18), transparent 60%);
  filter: blur(100px);
  z-index: 0; pointer-events: none;
  animation: float1 18s ease-in-out infinite;
}
body::after {
  content: '';
  position: fixed; bottom: -20%; right: -10%;
  width: 70%; height: 70%;
  background: radial-gradient(circle, rgba(147, 51, 234, 0.18), transparent 60%);
  filter: blur(100px);
  z-index: 0; pointer-events: none;
  animation: float2 22s ease-in-out infinite;
}
@keyframes float1 { 0%,100%{transform:translate(0,0);} 50%{transform:translate(5%,4%);} }
@keyframes float2 { 0%,100%{transform:translate(0,0);} 50%{transform:translate(-4%,-3%);} }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

.app {
  position: relative; z-index: 1;
  display: flex; min-height: 100vh;
}

/* === Sidebar (Dark Rainbow) === */
.sidebar {
  width: 240px;
  background: linear-gradient(180deg, #1E1B4B 0%, #0F0A2E 100%);
  border-right: 1px solid var(--border-slate);
  box-shadow: 4px 0 30px rgba(0, 0, 0, 0.15);
  display: flex; flex-direction: column; flex-shrink: 0;
  z-index: 10; min-height: 100vh;
}
.sidebar-brand {
  padding: 24px;
  background: linear-gradient(90deg, rgba(255, 140, 0, 0.15), rgba(147, 51, 234, 0.08), transparent);
  border-bottom: 1px solid var(--border-slate);
}
.logo-text {
  font-size: 1.1em; font-weight: 800;
  letter-spacing: 0.02em;
  background: linear-gradient(90deg, var(--c1-orange), var(--c2-green), var(--c3-blue), var(--c4-purple), var(--c5-pink));
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
  text-shadow: 0 0 20px rgba(147, 51, 234, 0.3);
  white-space: nowrap; line-height: 1.2;
}
.role-selector-wrap {
  padding: 12px 24px;
  background: rgba(11, 17, 30, 0.6);
  border-bottom: 1px solid var(--border-slate);
  display: flex; align-items: center; justify-content: space-between;
  font-size: 0.78em;
}
.role-selector-wrap > span { color: var(--text-mute); }
.role-selector-wrap select {
  background: rgba(22, 31, 48, 0.8);
  border: 1px solid var(--border-slate);
  color: #FFFFFF;
  border-radius: 6px; padding: 4px 8px; outline: none;
  font-size: 0.9em; font-family: inherit;
}
.role-selector-wrap select option { background: #1E1B4B; color: #FFFFFF; font-weight: 500; }
.role-selector-wrap select option:checked { background: linear-gradient(90deg, rgba(255,140,0,0.4), rgba(147,51,234,0.4)); color: #FFFFFF; }

.sidebar-menu { flex: 1; overflow-y: auto; padding: 12px; }
.sidebar-menu::-webkit-scrollbar { width: 6px; }
.sidebar-menu::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.2); border-radius: 3px; }

.menu-section-title {
  color: var(--text-mute);
  letter-spacing: 0.1em;
  padding: 8px 12px;
  margin-top: 8px;
  font-size: 0.7em; font-weight: 700;
  text-transform: uppercase;
  display: flex; align-items: center;
}
.menu-section-title i { margin-right: 8px; }

.menu-item {
  width: 100%; background: transparent; border: none;
  border-left: 3px solid transparent;
  color: rgba(255, 255, 255, 0.7);
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 0.9em; font-family: inherit;
  text-align: left; cursor: pointer;
  transition: all 0.25s ease;
  display: flex; align-items: center;
}
.menu-item i.fa-solid { width: 22px; text-align: center; margin-right: 10px; font-size: 1em; }
.menu-item:hover { background: rgba(255, 140, 0, 0.08); color: #FFFFFF; }
.menu-item.active {
  background: linear-gradient(90deg, rgba(255, 140, 0, 0.18), rgba(147, 51, 234, 0.10), rgba(236, 72, 153, 0.04));
  color: #FFFFFF;
  border-left-color: var(--c4-purple);
  font-weight: 600;
  box-shadow: inset 0 0 20px rgba(147, 51, 234, 0.08);
}
.menu-subitem {
  width: 100%; background: transparent; border: none;
  color: rgba(255, 255, 255, 0.5);
  padding: 7px 14px 7px 42px;
  border-radius: 6px;
  font-size: 0.82em; font-family: inherit;
  text-align: left; cursor: pointer;
  transition: all 0.25s ease;
  display: flex; align-items: center;
}
.menu-subitem:hover { color: #FFFFFF; background: rgba(255, 140, 0, 0.06); }
.menu-subitem .dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: currentColor; margin-right: 10px; opacity: 0.6;
}

.sidebar-footer {
  padding: 12px; text-align: center;
  font-size: 0.7em; color: rgba(255, 255, 255, 0.5);
  background: rgba(0, 0, 0, 0.3);
  border-top: 1px solid var(--border-slate);
}

/* === Main === */
.main {
  flex: 1; display: flex; flex-direction: column;
  min-height: 100vh;
}
.top-header {
  height: 56px;
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border-slate);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px; flex-shrink: 0;
}
.top-header h2 { font-size: 1.05em; font-weight: 700; color: var(--text-primary); }
.user-info { text-align: right; }
.user-name { color: var(--text-primary); font-size: 0.82em; font-weight: 600; margin: 0; }
.online-status {
  color: var(--neon-mint); font-size: 0.7em;
  display: flex; align-items: center; justify-content: flex-end; margin-top: 2px;
}
.online-dot {
  display: inline-block; width: 7px; height: 7px;
  border-radius: 50%; background: var(--neon-mint);
  box-shadow: 0 0 6px var(--neon-mint);
  margin-right: 4px; animation: pulse 2s infinite;
}

.main-view { flex: 1; padding: 20px 8px; overflow-y: auto; position: relative; z-index: 1; }
#routeContainer { width: 1200px; max-width: 100%; margin: 0 auto; box-sizing: border-box; padding: 0 8px; }
#routeContainer .glow-card { margin-left: auto; margin-right: auto; max-width: 100%; }
.main-view::-webkit-scrollbar { width: 8px; }
.main-view::-webkit-scrollbar-track { background: var(--bg-main); }
.main-view::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.2); border-radius: 4px; }

/* === Glow Card === */
.glow-card {
  background: #FFFFFF;
  border: 1px solid var(--border-slate);
  border-radius: 16px;
  position: relative; overflow: hidden;
  transition: all 0.3s ease;
  box-shadow: 0 2px 12px rgba(15, 23, 41, 0.04);
  margin-bottom: 16px;
}
.glow-card:hover {
  border-color: var(--c4-purple);
  box-shadow: 0 8px 24px rgba(147, 51, 234, 0.12);
  transform: translateY(-1px);
}

.section-title {
  font-size: 1.1em; font-weight: 700; color: var(--text-primary);
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 4px;
}
.section-title i { color: var(--c4-purple); }
.section-subtitle {
  font-size: 0.78em; color: var(--c3-blue);
  margin-bottom: 12px;
  display: flex; align-items: center; gap: 6px;
}
.section-subtitle::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: var(--c2-green); box-shadow: 0 0 6px var(--c2-green);
  animation: pulse 2s infinite;
}

/* === Section 1: PAD-02 Header === */
.section-1 { padding: 20px 24px; }

/* === Section 2: Strategy === */
.section-2 { padding: 20px 24px; }
.strategy-block {
  background: linear-gradient(90deg, rgba(255, 140, 0, 0.06), rgba(34, 197, 94, 0.04), rgba(59, 130, 246, 0.04), rgba(147, 51, 234, 0.04), rgba(236, 72, 153, 0.04));
  border-left: 3px solid var(--c4-purple);
  border-radius: 8px;
  padding: 12px 16px;
  margin-bottom: 12px;
}
.strategy-label {
  font-size: 0.78em; font-weight: 700;
  background: linear-gradient(90deg, var(--c1-orange), var(--c4-purple));
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
  margin-bottom: 4px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.strategy-text {
  font-size: 0.88em; color: var(--text-primary);
  line-height: 1.5;
}

/* === KR === */
.kr-item {
  margin-bottom: 12px;
  padding: 12px 16px;
  background: #F8FAFC;
  border-left: 3px solid transparent;
  border-radius: 6px;
  transition: all 0.2s ease;
}
.kr-item:hover { background: #F1F5F9; }
.kr-item.status-green { border-left-color: var(--status-green); }
.kr-item.status-yellow { border-left-color: var(--status-yellow); }
.kr-item.status-red { border-left-color: var(--status-red); }
.kr-title {
  font-size: 0.92em; font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 6px;
  display: flex; align-items: center; gap: 8px;
}
.kr-text {
  font-size: 0.82em; color: var(--text-secondary);
  line-height: 1.55;
}
.status-icon { font-size: 1em; }
.status-green .status-icon { color: var(--status-green); }
.status-yellow .status-icon { color: var(--status-yellow); }
.status-red .status-icon { color: var(--status-red); }

/* === KPI Section (สำหรับ Training/Roleplay/Mentor/Coach) === */
.kpi-section {
  padding: 20px 24px;
}
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
}
.kpi-item {
  background: #FFFFFF;
  border: 1px solid var(--border-slate);
  border-radius: 10px;
  padding: 14px 16px;
  border-left-width: 3px;
  transition: all 0.2s ease;
}
.kpi-item:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(15, 23, 41, 0.06);
}
.kpi-item.info { border-left-color: var(--c3-blue); }
.kpi-item.good { border-left-color: var(--status-green); }
.kpi-item.warn { border-left-color: var(--status-yellow); }
.kpi-item.bad { border-left-color: var(--status-red); }
.kpi-item .k-label { font-size: 0.75em; color: var(--text-mute); margin-bottom: 6px; }
.kpi-item .k-value { font-size: 1.5em; font-weight: 700; color: var(--text-primary); line-height: 1.1; }
.kpi-item .k-unit { font-size: 0.7em; color: var(--text-secondary); margin-top: 2px; }

/* === LG Table === */
.lg-wrap { padding: 16px 24px 24px; overflow-x: auto; }
.lg-table { width: 100%; border-collapse: collapse; font-size: 0.82em; }
.lg-table th {
  background: linear-gradient(90deg, rgba(255, 140, 0, 0.08), rgba(34, 197, 94, 0.06), rgba(59, 130, 246, 0.06), rgba(147, 51, 234, 0.06), rgba(236, 72, 153, 0.06));
  color: var(--text-primary);
  border-bottom: 2px solid var(--c4-purple);
  padding: 10px 12px;
  font-size: 0.7em; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.5px;
  text-align: left;
  white-space: nowrap;
}
.lg-table th.num { text-align: right; }
.lg-table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border-slate);
  color: var(--text-secondary);
  font-variant-numeric: tabular-nums;
}
.lg-table td.num { text-align: right; }
.lg-table td.cname { color: var(--text-primary); font-weight: 600; }
.lg-table tbody tr:hover { background: rgba(147, 51, 234, 0.04); }
.lg-table tbody tr:last-child td { border-bottom: none; }
.lg-table tfoot td {
  padding: 12px;
  background: linear-gradient(90deg, rgba(255, 140, 0, 0.08), rgba(236, 72, 153, 0.08));
  border-top: 2px solid var(--c4-purple);
  color: var(--text-primary);
  font-weight: 700;
}

/* === Form Styles (สำหรับ 2.1, 2.2, 2.3, ...) === */
.form-section {
  padding: 0 24px 24px;
}
.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 16px;
  margin-bottom: 20px;
}
.form-field-full { grid-column: 1 / -1; }
.form-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.form-field label {
  font-size: 0.82em;
  font-weight: 600;
  color: var(--text-primary);
  display: flex; align-items: center; gap: 4px;
}
.form-field .req {
  color: #EF4444;
  font-weight: 700;
}
.form-field .auto-tag {
  color: #94A3B8;
  font-size: 0.85em;
  font-weight: 500;
  font-style: italic;
}
.form-field input,
.form-field select,
.form-field textarea {
  font-family: inherit;
  font-size: 0.92em;
  padding: 10px 12px;
  border: 1.5px solid var(--border-slate);
  border-radius: 8px;
  background: #FFFFFF;
  color: var(--text-primary);
  outline: none;
  transition: all 0.2s ease;
}
/* Placeholder สีเทา (เห็นเฉพาะตอน input ว่าง) */
.form-field input::placeholder,
.form-field textarea::placeholder {
  color: #94A3B8;
  opacity: 1;
  font-style: italic;
}
.form-field input:focus,
.form-field select:focus,
.form-field textarea:focus {
  border-color: var(--c4-purple);
  box-shadow: 0 0 0 3px rgba(147, 51, 234, 0.12);
  background: #FAFBFF;
}
/* Disabled input style (สำหรับ fields auto-fill) */
.form-field input:disabled,
.form-field select:disabled {
  background: #F1F5F9;
  color: #94A3B8;
  cursor: not-allowed;
  font-style: italic;
}
/* Select placeholder style (ตอน disabled selected) */
.form-field select:invalid {
  color: #94A3B8;
  font-style: italic;
}
.form-field select option {
  color: var(--text-primary);
  font-style: normal;
}
.form-field select option[disabled]:first-child {
  color: #94A3B8;
  font-style: italic;
}
.form-actions {
  display: flex;
  gap: 12px;
  justify-content: flex-end;
  padding-top: 16px;
  border-top: 1px solid var(--border-slate);
}
.btn {
  font-family: inherit;
  font-size: 0.92em;
  font-weight: 600;
  padding: 10px 20px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: all 0.2s ease;
}
.btn-primary {
  background: linear-gradient(90deg, var(--c1-orange), var(--c4-purple));
  color: #FFFFFF;
  box-shadow: 0 2px 8px rgba(147, 51, 234, 0.2);
}
.btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(147, 51, 234, 0.3);
}
.btn-secondary {
  background: #F1F5F9;
  color: var(--text-primary);
  border: 1px solid var(--border-slate);
}
.btn-secondary:hover {
  background: #E2E8F0;
}
.form-status {
  margin-top: 16px;
  padding: 12px 16px;
  border-radius: 8px;
  font-size: 0.92em;
  font-weight: 500;
}
.form-status.success {
  background: rgba(34, 197, 94, 0.1);
  color: #15803D;
  border: 1px solid rgba(34, 197, 94, 0.3);
}
.form-status.error {
  background: rgba(239, 68, 68, 0.1);
  color: #B91C1C;
  border: 1px solid rgba(239, 68, 68, 0.3);
}
.form-status.info {
  background: rgba(59, 130, 246, 0.1);
  color: #1D4ED8;
  border: 1px solid rgba(59, 130, 246, 0.3);
}

@media (max-width: 640px) {
  .form-grid { grid-template-columns: 1fr; }
  .form-actions { flex-direction: column; }
  .form-actions .btn { width: 100%; justify-content: center; }
}

/* === Footer === */
.footer {
  text-align: center;
  color: var(--text-mute);
  font-size: 0.78em;
  margin-top: 16px;
  padding: 12px;
}
.footer a { color: var(--c3-blue); text-decoration: none; }
.footer a:hover { text-decoration: underline; }

/* === Responsive === */
@media (max-width: 1200px) {
  .sidebar { width: 240px; }
  .main-view { padding: 16px; }
  .top-header { padding: 0 16px; }
  .kpi-grid { grid-template-columns: 1fr; }
  .lg-table { font-size: 0.72em; }
  .lg-table th, .lg-table td { padding: 6px 4px; }
}
</style>
</head>
<body>
<div class="app">
<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="logo-text">P5 ระบบพัฒนาบุคลากร PKG</div>
    </div>
    <div class="role-selector-wrap">
      <span><i class="fa-solid fa-user-shield"></i> สิทธิ์:</span>
      <select id="roleSelect" onchange="onRoleChange(this.value)">
        <option value="admin">Admin (ทุกเมนู)</option>
        <option value="manager">Manager (ไม่มี กำกับทุนองค์กร)</option>
        <option value="member">Member (เฉพาะ Dashboard + Roleplay)</option>
      </select>
    </div>
    <nav class="sidebar-menu" id="dynamicMenu"></nav>
    <div class="sidebar-footer">&copy; 2026 PKG All Rights Reserved.</div>
  </aside>

  <main class="main">
    <header class="top-header">
      <h2>Dashboard</h2>

        <p class="user-name">ผู้ดูแลระบบ (Admin)</p>
        <p class="online-status"><span class="online-dot"></span> Online</p>
      </div>
    </header>

    <section class="main-view">
      <div id="routeContainer"></div>
    </section>

  </main>
</div>
    </section>
  </main>
</div>

<!-- ============================================================ -->
<!-- Page Templates — แต่ละ Route มี template แยก -->
<!-- ============================================================ -->
<template id="tpl-dashboard">      <!-- ส่วนที่ 1: PAD-02 Header -->
      <div class="glow-card section-1" id="sec-header">
        <div class="section-title">
          <i class="fa-solid fa-file-lines"></i>
          PAD-02 : รายงาน PP5 ระบบพัฒนาบุคลากร (PAD Team)
        </div>
        <div class="section-subtitle">
          ประจำวันที่ <span id="timestamp">กำลังโหลด…</span>
        </div>
      </div>

      <!-- ส่วนที่ 2: ยุทธศาสตร์ (Strategy) -->
      <div class="glow-card section-2" id="sec-strategy">
        <div class="section-title" style="margin-bottom: 14px;">
          <i class="fa-solid fa-bullseye"></i>
          ยุทธศาสตร์ (Strategy)
        </div>

        <div class="strategy-block">
          <div class="strategy-label">🎯 จุดมุ่งหมาย</div>
          <div class="strategy-text">พัฒนาสมาชิกตาม Core competency PKG</div>
        </div>

        <div class="strategy-block">
          <div class="strategy-label">🌟 ภาพความสำเร็จที่อยากเห็น</div>
          <div class="strategy-text">สมาชิก PKG มีทักษะที่เป็นเลิศ ตาม CC PKG และ AOE BU</div>
        </div>

        <div class="strategy-block">
          <div class="strategy-label">📌 OKR</div>
          <div class="strategy-text">สมาชิกมีแผนและได้รับการพัฒนาศักยภาพตามแผนครบทุกคน</div>

function classifyKpi(label) {
  const l = label.toLowerCase();
  if (l.includes('ครบ') || l.includes('ผ่าน') || l.includes('บรรลุ')) return 'good';
  if (l.includes('รอ') || l.includes('ไม่บรรลุ') || l.includes('น้อยกว่า')) return 'warn';
  if (l.includes('วิกฤต') || l.includes('ยังไม่บรรลุ')) return 'bad';
  return 'info';
}

function renderKpiGrid(elementId, items) {
  const grid = document.getElementById(elementId);
  if (!grid) return;
  grid.innerHTML = items.map(item => {
    const cls = classifyKpi(item.label);
    return `<div class="kpi-item ${cls}">
      <div class="k-label">${item.label}</div>
      <div class="k-value">${item.value}</div>
      <div class="k-unit">${item.unit || ''}</div>
    </div>`;
  }).join('');
}

function renderLgTable(data) {
  const table = document.getElementById('lgTable');
  if (!table || !data || !data.rows || data.rows.length === 0) {
    table.innerHTML = '<tr><td colspan="10" style="text-align:center;padding:20px;color:var(--text-mute);">ไม่มีข้อมูล</td></tr>';
    return;
  }
  const headers = data.headers;
  const companyCols = headers.slice(1, -2);
  const hasTotal = headers.includes('รวม');
  const hasRef = headers.includes('อ้างอิงสถานะ');
  let html = '<thead><tr><th class="cname">Capital</th>';
  companyCols.forEach(c => html += `<th class="num">${c}</th>`);
  if (hasTotal) html += '<th class="num">รวม</th>';
  if (hasRef) html += '<th>อ้างอิงสถานะ</th>';
  html += '</tr></thead><tbody>';
  data.rows.forEach(row => {
    html += '<tr>';
    html += `<td class="cname">${row.name || ''}</td>`;
    companyCols.forEach(c => {
      const v = row[c] !== undefined ? row[c] : '-';
      html += `<td class="num">${v}</td>`;
    });
    if (hasTotal) html += `<td class="num">${row.total !== undefined ? row.total : '-'}</td>`;
    if (hasRef) html += `<td style="font-size:0.78em;color:var(--text-mute);">${row.reference || ''}</td>`;
    html += '</tr>';
  });
  html += '</tbody>';
  table.innerHTML = html;
}

// ============================================================
// Real-time Clock (Asia/Bangkok)
// ============================================================
function updateRealtimeClock() {
  const now = new Date();
  const opts = {
    timeZone: 'Asia/Bangkok',
    year: 'numeric', month: 'long', day: 'numeric',
    hour: '2-digit', minute: '2-digit', second: '2-digit',
    hour12: false
  };
  const fmt = new Intl.DateTimeFormat('th-TH', opts);
  const parts = fmt.formatToParts(now);
  const get = (type) => parts.find(p => p.type === type)?.value || '';
  const day = get('day');
  const month = get('month');
  const year = get('year'); // th-TH locale แสดงเป็น พ.ศ. อยู่แล้ว (เช่น 2569)
  const hour = get('hour');
  const minute = get('minute');
  const second = get('second');
  const text = `${day} ${month} ${year} เวลา ${hour}:${minute}:${second} น.`;
  const ts = document.getElementById('timestamp');
  const ft = document.getElementById('footerTimestamp');
  if (ts) ts.textContent = text;
  if (ft) ft.textContent = text;
}

// === Render Menu (Dynamic) ===
// โครงสร้างตามภาพตัวอย่าง:
// - Dashboard = top-level button (กดได้)
// - Training/Mentor/Coach/Roleplay/กำกับทุน = section header (ไม่กด, แค่ label)
// - sub-items = button (กดได้)
function renderMenu() {
  const nav = document.getElementById('dynamicMenu');
  if (!nav) return;
  const allowed = window.PERMISSIONS[currentUser.role] || [];
  const items = window.MENU_CONFIG.filter(m => allowed.includes(m.id));
  
  // หา parent menus ที่มีลูกใน allowed
  const parentsNeeded = new Set();
  items.forEach(m => { if (m.parent) parentsNeeded.add(m.parent); });
  const parents = window.MENU_CONFIG.filter(m => parentsNeeded.has(m.id) && !m.parent);
  
  let html = '';
  
  // 1. Dashboard (top-level button)
  const dashboard = window.MENU_CONFIG.find(m => m.id === 'dashboard');
  if (dashboard && allowed.includes('dashboard')) {
    html += `<button class="menu-item" data-menu-id="dashboard" onclick="navigateTo('dashboard')">
      <i class="fa-solid ${dashboard.icon}"></i>
      <span>${dashboard.label}</span>
    </button>`;
  }
  
  // 2. Parent sections + sub-items
  parents.forEach(parent => {
    // Section header (ไม่กด)
    html += `<div class="menu-section-title">
      <i class="fa-solid ${parent.icon}"></i> ${parent.label}
    </div>`;
    
    // Sub-items (กดได้)
    const children = items.filter(m => m.parent === parent.id);
    children.forEach(child => {
      html += `<button class="menu-subitem" data-menu-id="${child.id}" onclick="navigateTo('${child.id}')">
        <span class="dot"></span><span>${child.label}</span>
      </button>`;
    });
  });
  
  nav.innerHTML = html;
}

// === Navigate (Route change) ===
function navigateTo(menuId) {
  currentRoute = menuId;
  
  // Update active state (sub-items แสดงเสมอ ไม่ต้อง expand/collapse)
  document.querySelectorAll('.menu-item, .menu-subitem').forEach(btn => btn.classList.remove('active'));
  const activeBtn = document.querySelector(`[data-menu-id="${menuId}"]`);
  if (activeBtn) activeBtn.classList.add('active');
  
  // Render page content
  renderPage(menuId);
  
  // Update header
  const menu = window.MENU_CONFIG.find(m => m.id === menuId);
  if (menu) {
    const h2 = document.querySelector('.top-header h2');
    if (h2) h2.textContent = menu.label;
  }
}

// === Render Page (Toggle route) ===
function renderPage(menuId) {
  const container = document.getElementById('routeContainer');
  if (!container) return;
  
  // Dashboard: ใช้ template เดิม
  if (menuId === 'dashboard') {
    const tpl = document.getElementById('tpl-dashboard');
    if (tpl) {
      container.innerHTML = '';
      container.appendChild(tpl.content.cloneNode(true));
    }
    return;
  }
  
  // Sub-pages: เลือก template ตาม menuId
  let tplId = 'tpl-page';
  if (menuId === 'training-2-1') tplId = 'tpl-form-2-1';
  // เพิ่ม form อื่นๆ ที่นี่

  const tpl = document.getElementById(tplId);
  if (tpl) {
    container.innerHTML = '';
    container.appendChild(tpl.content.cloneNode(true));
    // ถ้าเป็น tpl-page (ไม่ใช่ form) ให้ fill dynamic data
    if (tplId === 'tpl-page') {
      const menu = window.MENU_CONFIG.find(m => m.id === menuId);
      if (menu) {
        const t = document.getElementById('pageTitle');
        const s = document.getElementById('pageSubtitle');
        if (t) t.textContent = menu.label;
        if (s) s.textContent = menu.parent ? `เมนูย่อยของ ${menu.parent}` : 'เมนูหลัก';
      }
    }

      }

  }
}

// === Form Submit (จำลอง - ยังไม่ได้เชื่อม Google Sheet) ===
function submitForm(event, formId) {
  event.preventDefault();
  const form = document.getElementById(formId);
  if (!form) return;
  const status = document.getElementById('formStatus');
  
  // Collect form data
  const formData = new FormData(form);
  const data = {};
  formData.forEach((value, key) => { data[key] = value; });
  
  // แสดง status
  if (status) {
    status.className = 'form-status info';
    status.style.display = 'block';
    status.innerHTML = '<i class="fa-solid fa-circle-info"></i> กำลังบันทึก...';
  }
  
  // จำลองการบันทึก (เนื่องจากยังไม่ได้เชื่อม Google Apps Script)
  setTimeout(() => {
    if (status) {
      status.className = 'form-status success';
      status.innerHTML = `
        <i class="fa-solid fa-circle-check"></i> 
        <strong>บันทึกสำเร็จ!</strong><br>
        <small>📋 ข้อมูล: ${JSON.stringify(data, null, 2)}</small><br>
        <small>⚠️ โหมดจำลอง — ยังไม่ได้เชื่อมต่อ Google Sheet จริง (ติดต่อตี๋เพื่อเปิดใช้งานจริง)</small>
      `;
    }
    console.log('Form data:', data);
  }, 800);
}

// === Form Reset ===
function resetForm(formId) {
  const form = document.getElementById(formId);
  if (form) {
    form.reset();
    // Reset auto-fill fields
    const firstName = document.getElementById('firstName');
    const lastName = document.getElementById('lastName');

    if (lastName) lastName.value = '';

// === Auto-fill ชื่อ-นามสกุล (ดึงจาก PKGemployee gid=572791880) ===
// v7.3: Preload ทันทีตอน load + Auto-fill ขณะพิมพ์ (input event) + Fallback URL
const EMPLOYEE_SHEET_CSV = 'https://docs.google.com/spreadsheets/d/1CkBSi_votE01b0fxFFwU1EQb_7mzEJgGvWGaegocbeM/gviz/tq?tqx=out:csv&gid=572791880&tq=select%20A%2CC%2CD';
const EMPLOYEE_SHEET_CSV_FALLBACK = 'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://docs.google.com/spreadsheets/d/1CkBSi_votE01b0fxFFwU1EQb_7mzEJgGvWGaegocbeM/gviz/tq?tqx=out:csv&gid=572791880&tq=select%20A%2CC%2CD');
let employeeMap = null;     // Map: id -> { firstName, lastName }
let employeeLoading = null;  // Promise (cache การโหลด)
let employeeLoadingStatus = 'idle'; // idle | loading | ready | failed

/** Parse CSV line — รองรับ comma ใน quoted fields */
function parseCSVLine(line) {
  const result = [];
  let cur = '';
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') { inQuotes = !inQuotes; continue; }
    if (ch === ',' && !inQuotes) { result.push(cur); cur = ''; continue; }
    cur += ch;
  }
  result.push(cur);
  return result;
}

/** สร้าง Map จาก CSV text */
function buildMapFromCSV(csv, source) {
  const map = new Map();
  const lines = csv.split('\n');
  for (let i = 1; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;
    const cols = parseCSVLine(line);
    if (cols.length < 3) continue;
    const id = cols[0].trim();
    const firstName = (cols[1] || '').trim();
    const lastName = (cols[2] || '').trim();
    if (id && (firstName || lastName)) {
      map.set(id, { firstName, lastName });
      if (/^\d+$/.test(id)) map.set('M-' + id.padStart(5, '0'), { firstName, lastName });
    }
  }
  console.log(`✅ โหลดสมาชิกจาก ${source}: ${map.size} รายการ`);
  return map;
}

async function loadEmployeeMap() {
  if (employeeMap && employeeMap.size > 0) return employeeMap;
  if (employeeLoading) return employeeLoading;
  employeeLoadingStatus = 'loading';
  employeeLoading = (async () => {
    // ลอง primary ก่อน (gviz/tq — CORS-friendly)
    try {
      const res = await fetch(EMPLOYEE_SHEET_CSV, { method: 'GET' });
      if (res.ok) {
        const csv = await res.text();
        if (csv && csv.length > 100) {
          employeeMap = buildMapFromCSV(csv, 'gviz/tq');
          employeeLoadingStatus = 'ready';
          // Verify critical ID
          console.log('🔍 6006083 →', employeeMap.get('6006083'));
          return employeeMap;
        }
      }
      throw new Error('Primary empty or failed');
    } catch (e) {
      console.warn('⚠️ Primary URL failed, trying fallback (allorigins.win):', e.message);
      // Fallback: allorigins proxy
      try {
        const res2 = await fetch(EMPLOYEE_SHEET_CSV_FALLBACK, { method: 'GET' });
        if (res2.ok) {
          const csv = await res2.text();
          if (csv && csv.length > 100) {
            employeeMap = buildMapFromCSV(csv, 'allorigins.win');
            employeeLoadingStatus = 'ready';
            console.log('🔍 6006083 (fallback) →', employeeMap.get('6006083'));
            return employeeMap;
          }
        }
        throw new Error('Fallback empty or failed');
      } catch (e2) {
        console.error('❌ โหลดข้อมูลสมาชิกล้มเหลวทั้ง 2 วิธี:', e.message, '/', e2.message);
        employeeLoadingStatus = 'failed';
        employeeMap = new Map();
        return employeeMap;
      }
    }
  })();
  return employeeLoading;
}

// ⭐ Preload map ทันทีตอนหน้า load (ไม่ต้องรอ user เปิดฟอร์ม)
window.addEventListener('DOMContentLoaded', () => {
  console.log('🚀 Preload employee map...');
  loadEmployeeMap();
});

async function autoFillName() {
  const producerId = document.getElementById('producerId');
  const firstName = document.getElementById('firstName');
  const lastName = document.getElementById('lastName');
  if (!producerId || !firstName || !lastName) return;
  const id = producerId.value.trim();
  if (!id) {
    firstName.value = '';
    lastName.value = '';
    firstName.placeholder = 'กรอกรหัสสมาชิกก่อน';
    lastName.placeholder = 'กรอกรหัสสมาชิกก่อน';
    firstName.style.background = '#f0f9ff';
    lastName.style.background = '#f0f9ff';
    return;
  }
  // แสดงสถานะกำลังโหลด
  firstName.placeholder = '⏳ กำลังค้นหา...';
  lastName.placeholder = '⏳ กำลังค้นหา...';
  const map = await loadEmployeeMap();
  // ลองหาแบบตรงๆ ก่อน, ถ้าไม่เจอลอง strip non-digit
  let emp = map.get(id);
  if (!emp) {
    const digits = id.replace(/\D/g, '');
    if (digits) {
      emp = map.get(digits) || map.get('M-' + digits.padStart(5, '0'));
    }
  }
  console.log('🔍 ค้นหา ID:', id, '→', emp ? `เจอ: ${emp.firstName} ${emp.lastName}` : 'ไม่เจอ (map size=' + map.size + ', status=' + employeeLoadingStatus + ')');
  if (emp) {
    firstName.value = emp.firstName;
    lastName.value = emp.lastName;
    firstName.placeholder = '';
    lastName.placeholder = '';
    // ⭐ Visual feedback: highlight + pulse
    firstName.style.background = '#d1fae5';
    lastName.style.background = '#d1fae5';
    firstName.style.color = '#065f46';
    lastName.style.color = '#065f46';
    firstName.style.fontWeight = '600';
    lastName.style.fontWeight = '600';
    setTimeout(() => {
      firstName.style.background = '#f0f9ff';
      lastName.style.background = '#f0f9ff';
    }, 1500);
  } else {
    firstName.value = '';
    lastName.value = '';
    if (employeeLoadingStatus === 'loading') {
      firstName.placeholder = '⏳ กำลังโหลดข้อมูล...';
      lastName.placeholder = '⏳ กำลังโหลดข้อมูล...';
    } else if (employeeLoadingStatus === 'failed') {
      firstName.placeholder = '❌ โหลดข้อมูลล้มเหลว — ติดต่อตี๋';
      lastName.placeholder = '❌ โหลดข้อมูลล้มเหลว — ติดต่อตี๋';
    } else {
      firstName.placeholder = '❌ ไม่พบรหัส ' + id;
      lastName.placeholder = '❌ ไม่พบรหัส ' + id;
    }
    firstName.style.background = '#fee2e2';
    lastName.style.background = '#fee2e2';
  }
}

// === Event: ผูกกับ document เพื่อจับทุก event (รวม input ขณะพิมพ์) ===
document.addEventListener('input', (e) => {
  if (e.target && e.target.id === 'producerId') autoFillName();
});
document.addEventListener('change', (e) => {
  if (e.target && e.target.id === 'producerId') autoFillName();
});
document.addEventListener('blur', (e) => {
  if (e.target && e.target.id === 'producerId') autoFillName();
}, true);
// Backward-compat: ผูกตอน DOMContentLoaded
document.addEventListener('DOMContentLoaded', () => {
  const producerId = document.getElementById('producerId');
  if (producerId) {
    producerId.addEventListener('blur', autoFillName);
    producerId.addEventListener('change', autoFillName);
  }
});
