<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P5 Dashboard · v7.7 (Layout+Font v2) — Production · latest</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
/* (Same CSS as share.html) */
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap');
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
html { font-size: 20px; } /* v7.7 +3 ระดับ (16 → 20) */

:root {
  /* 🎨 Rainbow Palette (from sample image) */
  --bg-main: #F9FAFE;             /* Light blue-white background */
  --card-bg: #FFFFFF;              /* White card */
  --border-slate: rgba(15, 23, 41, 0.08);
  --border-glow: rgba(255, 165, 0, 0.3);
  --text-primary: #0F1729;         /* Dark text */
  --text-secondary: #475569;
  --text-mute: #94A3B8;
  
  /* 5 Rainbow colors (Ribbon 01-05) */
  --c1-orange: #FF8C00;            /* Ribbon 01: Orange */
  --c2-green: #22C55E;             /* Ribbon 02: Green */
  --c3-blue: #3B82F6;              /* Ribbon 03: Blue */
  --c4-purple: #9333EA;            /* Ribbon 04: Purple */
  --c5-pink: #EC4899;              /* Ribbon 05: Pink/Red */
  
  /* Legacy aliases (mapped to rainbow) */
  --neon-purple: #9333EA;          /* = c4 */
  --neon-cyan: #3B82F6;            /* = c3 */
  --neon-magenta: #EC4899;         /* = c5 */
  --neon-mint: #22C55E;            /* = c2 */
  --neon-orange: #FF8C00;          /* = c1 */
  
  /* Status colors (rainbow version) */
  --status-green: #22C55E;
  --status-yellow: #F59E0B;
  --status-red: #EF4444;
}

body {
  font-family: 'Sarabun', 'Inter', sans-serif;
  background-color: var(--bg-main);
  color: var(--text-secondary);
  position: relative;
  overflow-x: hidden;
  min-height: 100vh;
}

body::before {
  content: '';
  position: fixed; top: -20%; left: -10%;
  width: 70%; height: 70%;
  background: radial-gradient(circle, rgba(255, 140, 0, 0.18), transparent 60%);
  filter: blur(100px);
  z-index: 0; pointer-events: none;
  animation: float1 18s ease-in-out infinite;
}
body::after {
  content: '';
  position: fixed; bottom: -20%; right: -10%;
  width: 70%; height: 70%;
  background: radial-gradient(circle, rgba(147, 51, 234, 0.18), transparent 60%);
  filter: blur(100px);
  z-index: 0; pointer-events: none;
  animation: float2 22s ease-in-out infinite;
}
@keyframes float1 { 0%,100%{transform:translate(0,0);} 50%{transform:translate(5%,4%);} }
@keyframes float2 { 0%,100%{transform:translate(0,0);} 50%{transform:translate(-4%,-3%);} }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

.app {
  position: relative; z-index: 1;
  display: flex; min-height: 100vh;
}

/* === Sidebar (Dark Rainbow) === */
.sidebar {
  width: 320px;
  background: linear-gradient(180deg, #1E1B4B 0%, #0F0A2E 100%);
  border-right: 1px solid var(--border-slate);
  box-shadow: 4px 0 30px rgba(0, 0, 0, 0.15);
  display: flex; flex-direction: column; flex-shrink: 0;
  z-index: 10; min-height: 100vh;
}
.sidebar-brand {
  padding: 18px 16px;
  background: linear-gradient(90deg, rgba(255, 140, 0, 0.15), rgba(147, 51, 234, 0.08), transparent);
  border-bottom: 1px solid var(--border-slate);
  box-sizing: border-box;
  width: 100%;
  overflow: hidden;
}
.logo-text {
  font-size: 0.95em; font-weight: 800;
  letter-spacing: 0.01em;
  background: linear-gradient(90deg, var(--c1-orange), var(--c2-green), var(--c3-blue), var(--c4-purple), var(--c5-pink));
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
  text-shadow: 0 0 20px rgba(147, 51, 234, 0.3);
  white-space: normal; line-height: 1.25;
  word-break: keep-all;
}
.role-selector-wrap {
  padding: 12px 18px;
  background: rgba(11, 17, 30, 0.6);
  border-bottom: 1px solid var(--border-slate);
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  font-size: 0.78em;
  box-sizing: border-box;
  width: 100%;
  overflow: hidden;
}
.role-selector-wrap > span { color: var(--text-mute); flex-shrink: 0; white-space: nowrap; }
.role-selector-wrap select {
  background: rgba(22, 31, 48, 0.8);
  border: 1px solid var(--border-slate);
  color: #FFFFFF;
  border-radius: 6px; padding: 4px 6px; outline: none;
  font-size: 0.78em; font-family: inherit;
  width: 0; min-width: 0; flex: 1;
  text-overflow: ellipsis;
  box-sizing: border-box;
}
.role-selector-wrap select option {
  background: #1E1B4B; color: #FFFFFF; font-weight: 500;
  max-width: 100%; overflow: hidden; text-overflow: ellipsis;
}
.role-selector-wrap select option:checked { background: linear-gradient(90deg, rgba(255,140,0,0.4), rgba(147,51,234,0.4)); color: #FFFFFF; }

.sidebar-menu { flex: 1; overflow-y: auto; padding: 12px; }
.sidebar-menu::-webkit-scrollbar { width: 6px; }
.sidebar-menu::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.2); border-radius: 3px; }

.menu-section-title {
  color: var(--text-mute);
  letter-spacing: 0.1em;
  padding: 8px 12px;
  margin-top: 8px;
  font-size: 0.7em; font-weight: 700;
  text-transform: uppercase;
  display: flex; align-items: center;
}
.menu-section-title i { margin-right: 8px; }

.menu-item {
  width: 100%; background: transparent; border: none;
  border-left: 3px solid transparent;
  color: rgba(255, 255, 255, 0.7);
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 0.9em; font-family: inherit;
  text-align: left; cursor: pointer;
  transition: all 0.25s ease;
  display: flex; align-items: center;
}
.menu-item i.fa-solid { width: 22px; text-align: center; margin-right: 10px; font-size: 1em; }
.menu-item:hover { background: rgba(255, 140, 0, 0.08); color: #FFFFFF; }
.menu-item.active {
  background: linear-gradient(90deg, rgba(255, 140, 0, 0.18), rgba(147, 51, 234, 0.10), rgba(236, 72, 153, 0.04));
  color: #FFFFFF;
  border-left-color: var(--c4-purple);
  font-weight: 600;
  box-shadow: inset 0 0 20px rgba(147, 51, 234, 0.08);
}
.menu-subitem {
  width: 100%; background: transparent; border: none;
  color: rgba(255, 255, 255, 0.5);
  padding: 7px 14px 7px 42px;
  border-radius: 6px;
  font-size: 0.82em; font-family: inherit;
  text-align: left; cursor: pointer;
  transition: all 0.25s ease;
  display: flex; align-items: center;
}
.menu-subitem:hover { color: #FFFFFF; background: rgba(255, 140, 0, 0.06); }
.menu-subitem .dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: currentColor; margin-right: 10px; opacity: 0.6;
}

.sidebar-footer {
  padding: 12px; text-align: center;
  font-size: 0.7em; color: rgba(255, 255, 255, 0.5);
  background: rgba(0, 0, 0, 0.3);
  border-top: 1px solid var(--border-slate);
}

/* === Main === */
.main {
  flex: 1; display: flex; flex-direction: column;
  min-height: 100vh;
}
.top-header {
  height: 56px;
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border-slate);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px; flex-shrink: 0;
}
.top-header h2 { font-size: 1.05em; font-weight: 700; color: var(--text-primary); }
.user-info { text-align: right; }
.user-name { color: var(--text-primary); font-size: 0.82em; font-weight: 600; margin: 0; }
.online-status {
  color: var(--neon-mint); font-size: 0.7em;
  display: flex; align-items: center; justify-content: flex-end; margin-top: 2px;
}
.online-dot {
  display: inline-block; width: 7px; height: 7px;
  border-radius: 50%; background: var(--neon-mint);
  box-shadow: 0 0 6px var(--neon-mint);
  margin-right: 4px; animation: pulse 2s infinite;
}

.main-view { flex: 1; padding: 20px 0; overflow-y: auto; position: relative; z-index: 1; }
#routeContainer { width: 1400px; max-width: calc(100% - 40px); margin: 0 auto; box-sizing: border-box; padding: 0 12px; }

/* Layout 2-column (v7.7) */
.layout-row {
  display: grid;
  grid-template-columns: 1fr 1.4fr;
  gap: 16px;
  margin-bottom: 0;
}
.layout-row > .glow-card { margin-bottom: 16px; }
#routeContainer .glow-card { margin-left: auto; margin-right: auto; max-width: 100%; }
.main-view::-webkit-scrollbar { width: 8px; }
.main-view::-webkit-scrollbar-track { background: var(--bg-main); }
.main-view::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.2); border-radius: 4px; }

/* === Glow Card === */
.glow-card {
  background: #FFFFFF;
  border: 1px solid var(--border-slate);
  border-radius: 16px;
  position: relative; overflow: hidden;
  transition: all 0.3s ease;
  box-shadow: 0 2px 12px rgba(15, 23, 41, 0.04);
  margin-bottom: 16px;
}
.glow-card:hover {
  border-color: var(--c4-purple);
  box-shadow: 0 8px 24px rgba(147, 51, 234, 0.12);
  transform: translateY(-1px);
}

.section-title {
  font-size: 1.1em; font-weight: 700; color: var(--text-primary);
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 4px;
}
.section-title i { color: var(--c4-purple); }
.section-subtitle {
  font-size: 0.78em; color: var(--c3-blue);
  margin-bottom: 12px;
  display: flex; align-items: center; gap: 6px;
}
.section-subtitle::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: var(--c2-green); box-shadow: 0 0 6px var(--c2-green);
  animation: pulse 2s infinite;
}

/* === Section 1: PAD-02 Header === */
.section-1 { padding: 20px 24px; }

/* === Section 2: Strategy === */
.section-2 { padding: 20px 24px; }
.strategy-block {
  background: linear-gradient(90deg, rgba(255, 140, 0, 0.06), rgba(34, 197, 94, 0.04), rgba(59, 130, 246, 0.04), rgba(147, 51, 234, 0.04), rgba(236, 72, 153, 0.04));
  border-left: 3px solid var(--c4-purple);
  border-radius: 8px;
  padding: 12px 16px;
  margin-bottom: 12px;
}
.strategy-label {
  font-size: 0.78em; font-weight: 700;
  background: linear-gradient(90deg, var(--c1-orange), var(--c4-purple));
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
  margin-bottom: 4px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.strategy-text {
  font-size: 0.88em; color: var(--text-primary);
  line-height: 1.5;
}

/* === KR === */
.kr-item {
  margin-bottom: 12px;
  padding: 12px 16px;
  background: #F8FAFC;
  border-left: 3px solid transparent;
  border-radius: 6px;
  transition: all 0.2s ease;
}
.kr-item:hover { background: #F1F5F9; }
.kr-item.status-green { border-left-color: var(--status-green); }
.kr-item.status-yellow { border-left-color: var(--status-yellow); }
.kr-item.status-red { border-left-color: var(--status-red); }
.kr-title {
  font-size: 0.92em; font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 6px;
  display: flex; align-items: center; gap: 8px;
}
.kr-text {
  font-size: 0.82em; color: var(--text-secondary);
  line-height: 1.55;
}
.status-icon { font-size: 1em; }
.status-green .status-icon { color: var(--status-green); }
.status-yellow .status-icon { color: var(--status-yellow); }
.status-red .status-icon { color: var(--status-red); }

/* === KPI Section (สำหรับ Training/Roleplay/Mentor/Coach) === */
.kpi-section {
  padding: 20px 24px;
}
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
}

/* === Pie Chart Card (Section 3 Summary) === */
.pie-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
  margin-bottom: 14px;
}

/* === Donut Section Grid (Training/Roleplay/Mentor/Coach) === */
.donut-section-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 14px;
  padding: 4px;
}
.donut-card-c {
  background: linear-gradient(135deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
  border: 1px solid var(--border-slate);
  border-radius: 12px;
  padding: 14px 12px 12px;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  transition: all 0.25s ease;
}
.donut-card-c:hover {
  border-color: var(--border-glow);
  box-shadow: 0 6px 20px rgba(167, 139, 250, 0.15);
  transform: translateY(-1px);
}
.donut-chart {
  width: 110px; height: 110px;
  filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.15));
}
.donut-card-label {
  font-size: 0.78em; color: var(--text-primary);
  font-weight: 700;
  text-align: center;
  line-height: 1.3;
}
.donut-card-detail {
  font-size: 0.7em; color: var(--text-mute);
  text-align: center;
  display: flex; align-items: center; gap: 4px; justify-content: center;
}
.pie-card {
  background: linear-gradient(135deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
  border: 1px solid var(--border-slate);
  border-radius: 16px;
  padding: 22px 18px 18px;
  position: relative;
  overflow: hidden;
  transition: all 0.3s ease;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  color: var(--c1-orange);
}
.pie-card:hover {
  border-color: currentColor;
  box-shadow: 0 8px 28px rgba(167, 139, 250, 0.20);
  transform: translateY(-2px);
}
.pie-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, currentColor, transparent);
  opacity: 0.7;
}
.pie-svg {
  width: 140px; height: 140px;
  filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.30));
  transform: rotate(0deg);
}
.pie-svg circle, .pie-svg path {
  transition: all 1s ease;
}
.pie-center {
  font-size: 1.5em; font-weight: 800;
  background: linear-gradient(90deg, currentColor, var(--c3-blue));
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
}
.pie-label {
  font-size: 0.85em; color: var(--text-primary);
  font-weight: 700;
  text-align: center;
}
.pie-detail {
  font-size: 0.7em; color: var(--text-mute);
  text-align: center;
  display: flex; align-items: center; gap: 4px; justify-content: center;
}
.pie-card.c1 { color: var(--c1-orange); }
.pie-card.c2 { color: var(--c2-green); }
.pie-card.c3 { color: var(--c3-blue); }
.pie-card.c4 { color: var(--c4-purple); }

.kpi-item {
  background: #FFFFFF;
  border: 1px solid var(--border-slate);
  border-radius: 10px;
  padding: 14px 16px;
  border-left-width: 3px;
  transition: all 0.2s ease;
}
.kpi-item:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(15, 23, 41, 0.06);
}
.kpi-item.info { border-left-color: var(--c3-blue); }
.kpi-item.good { border-left-color: var(--status-green); }
.kpi-item.warn { border-left-color: var(--status-yellow); }
.kpi-item.bad { border-left-color: var(--status-red); }
.kpi-item .k-label { font-size: 0.75em; color: var(--text-mute); margin-bottom: 6px; }
.kpi-item .k-value { font-size: 1.5em; font-weight: 700; color: var(--text-primary); line-height: 1.1; }
.kpi-item .k-unit { font-size: 0.7em; color: var(--text-secondary); margin-top: 2px; }

/* === LG Table === */
.lg-wrap { padding: 16px 24px 24px; overflow-x: auto; max-width: 100%; }
.lg-table { width: 100%; max-width: 100%; border-collapse: collapse; font-size: 0.82em; table-layout: auto; }
.lg-table th {
  background: linear-gradient(90deg, rgba(255, 140, 0, 0.08), rgba(34, 197, 94, 0.06), rgba(59, 130, 246, 0.06), rgba(147, 51, 234, 0.06), rgba(236, 72, 153, 0.06));
  color: var(--text-primary);
  border-bottom: 2px solid var(--c4-purple);
  padding: 10px 12px;
  font-size: 0.7em; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.5px;
  text-align: left;
  white-space: nowrap;
}
.lg-table th.num { text-align: right; }
.lg-table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border-slate);
  color: var(--text-secondary);
  font-variant-numeric: tabular-nums;
}
.lg-table td.num { text-align: right; }
.lg-table td.cname { color: var(--text-primary); font-weight: 600; }
.lg-table tbody tr:hover { background: rgba(147, 51, 234, 0.04); }
.lg-table tbody tr:last-child td { border-bottom: none; }
.lg-table tfoot td {
  padding: 12px;
  background: linear-gradient(90deg, rgba(255, 140, 0, 0.08), rgba(236, 72, 153, 0.08));
  border-top: 2px solid var(--c4-purple);
  color: var(--text-primary);
  font-weight: 700;
}

/* === Form Styles (สำหรับ 2.1, 2.2, 2.3, ...) === */
.form-section {
  padding: 0 24px 24px;
}
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr; /* ⭐ fix 2 columns เสมอ — ผลลัพท์ → KPI ต่อ row */
  gap: 16px;
  margin-bottom: 20px;
}
.form-field-full { grid-column: 1 / -1; }
.result-kpi-pair { display: contents; } /* กลุ่มผลลัพท์+KPI ไม่ห่อ DOM ใหม่ — grid จัดเอง */
.form-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.form-field label {
  font-size: 0.82em;
  font-weight: 600;
  color: var(--text-primary);
  display: flex; align-items: center; gap: 4px;
}
.form-field .req {
  color: #EF4444;
  font-weight: 700;
}
.form-field .auto-tag {
  color: #94A3B8;
  font-size: 0.85em;
  font-weight: 500;
  font-style: italic;
}
.form-field input,
.form-field select,
.form-field textarea {
  font-family: inherit;
  font-size: 0.92em;
  padding: 10px 12px;
  border: 1.5px solid var(--border-slate);
  border-radius: 8px;
  background: #FFFFFF;
  color: var(--text-primary);
  outline: none;
  transition: all 0.2s ease;
}
/* Placeholder สีเทา (เห็นเฉพาะตอน input ว่าง) */
.form-field input::placeholder,
.form-field textarea::placeholder {
  color: #94A3B8;
  opacity: 1;
  font-style: italic;
}
.form-field input:focus,
.form-field select:focus,
.form-field textarea:focus {
  border-color: var(--c4-purple);
  box-shadow: 0 0 0 3px rgba(147, 51, 234, 0.12);
  background: #FAFBFF;
}
/* Disabled input style (สำหรับ fields auto-fill) */
.form-field input:disabled,
.form-field select:disabled {
  background: #F1F5F9;
  color: #94A3B8;
  cursor: not-allowed;
  font-style: italic;
}
/* Select placeholder style (ตอน disabled selected) */
.form-field select:invalid {
  color: #94A3B8;
  font-style: italic;
}
.form-field select option {
  color: var(--text-primary);
  font-style: normal;
}
.form-field select option[disabled]:first-child {
  color: #94A3B8;
  font-style: italic;
}
.form-actions {
  display: flex;
  gap: 12px;
  justify-content: flex-end;
  padding-top: 16px;
  border-top: 1px solid var(--border-slate);
}
.btn {
  font-family: inherit;
  font-size: 0.92em;
  font-weight: 600;
  padding: 10px 20px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: all 0.2s ease;
}
.btn-primary {
  background: linear-gradient(90deg, var(--c1-orange), var(--c4-purple));
  color: #FFFFFF;
  box-shadow: 0 2px 8px rgba(147, 51, 234, 0.2);
}
.btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(147, 51, 234, 0.3);
}
.btn-secondary {
  background: #F1F5F9;
  color: var(--text-primary);
  border: 1px solid var(--border-slate);
}
.btn-secondary:hover {
  background: #E2E8F0;
}
.form-status {
  margin-top: 16px;
  padding: 12px 16px;
  border-radius: 8px;
  font-size: 0.92em;
  font-weight: 500;
}
.form-status.success {
  background: rgba(34, 197, 94, 0.1);
  color: #15803D;
  border: 1px solid rgba(34, 197, 94, 0.3);
}
.form-status.error {
  background: rgba(239, 68, 68, 0.1);
  color: #B91C1C;
  border: 1px solid rgba(239, 68, 68, 0.3);
}
.form-status.info {

function tr22Num(n) { return Number(n || 0).toLocaleString('en-US'); }

function tr22Card(r) {
  const ringCls = r.readiness >= 85 ? 'green' : r.readiness >= 60 ? 'gold' : 'red';
  const stCls = r.status === 'พร้อมเปิด' ? 'success' : r.status === 'แบบร่าง' ? 'muted' : 'warn';
  const doneN = Math.round(r.readiness / 20);
  return `
  <article class="tr22-card" data-type="${r.type}" data-status="${r.status}">
    <div class="tr22-head">
      <span class="tr22-id">${r.id}</span>
      <span class="tr22-badge">${r.type}</span>
      <span class="tr22-badge ${stCls}">${r.status}</span>
    </div>
    <h4>${r.course}</h4>
    <p>${r.objective}</p>
    <div class="tr22-meta">
      <span>${r.bu}</span><span>${r.dateRange}</span><span>${r.learners} คน</span><span>ผู้ขอ: ${r.owner}</span>
    </div>
    <div class="tr22-body">
      <div class="tr22-detail">
        <div><strong>วิทยากร</strong><span>${r.trainer}</span></div>
        <div><strong>สถานที่</strong><span>${r.venue}</span></div>
        <div><strong>งบ</strong><span>${r.budget ? tr22Num(r.budget) + ' บาท' : 'ไม่ใช้งบ'}</span></div>
        <div><strong>Blocker</strong><span>${r.blockers.length ? r.blockers.join(' · ') : 'ไม่มี'}</span></div>
      </div>
      <div>
        <div class="tr22-ring ${ringCls}" style="--pct:${r.readiness}"><b>${r.readiness}%</b></div>
        <small class="tr22-ringcap">ความพร้อม</small>
      </div>
    </div>
    <div class="tr22-check">
      ${r.checklist.map((c, i) => `<span class="${i < doneN ? 'done' : ''}">${c}</span>`).join('')}
    </div>
  </article>`;
}

function tr22Filter(btn, key) {
  btn.parentElement.querySelectorAll('.tr22-chip').forEach(b => b.classList.toggle('active', b === btn));
  document.querySelectorAll('#tr22Root .tr22-card').forEach(card => {
    card.hidden = !(key === 'all' || card.dataset.type === key || card.dataset.status.indexOf(key) === 0);
  });
}

function renderTR22() {
  const root = document.getElementById('tr22Root');
  if (!root) return;
  const rs = window.TR22_REQUESTS;
  const ready = rs.filter(r => r.status === 'พร้อมเปิด').length;
  const waiting = rs.filter(r => r.status.indexOf('รอ') === 0).length;
  const learners = rs.reduce((s, r) => s + r.learners, 0);
  const budget = rs.reduce((s, r) => s + r.budget, 0);
  const avg = rs.length ? Math.round(rs.reduce((s, r) => s + r.readiness, 0) / rs.length) : 0;
  const kpi = (lbl, val, unit, cls) =>
    `<div class="tr22-kpi ${cls}"><div class="lbl">${lbl}</div><div class="val">${val}</div><div class="unit">${unit}</div></div>`;
  const step = (t, s, state) =>
    `<div class="tr22-step ${state}"><i></i><div><strong>${t}</strong><small>${s}</small></div></div>`;

  root.innerHTML = `
    <div class="tr22-pagemap">
      ${window.TR22_PAGES.map(p => `
        <div class="tr22-pill ${p.id === '2.2' ? 'active' : ''}">
          <span class="pid">${p.id}</span>
          <span><strong>${p.title}</strong><small>${p.goal}</small></span>
          <em>${p.status === 'prototype' ? 'กำลังทำ' : 'ต่อไป'}</em>
        </div>`).join('')}
    </div>

    <div class="tr22-kpis">
      ${kpi('คำขอทั้งหมด', rs.length, 'รายการ', 'purple')}
      ${kpi('รออนุมัติ/ตรวจงบ', waiting, 'รายการ', 'orange')}
      ${kpi('ผู้เรียนรวม', tr22Num(learners), 'คน', '')}
      ${kpi('งบประมาณรวม', tr22Num(budget), 'บาท', 'green')}
      ${kpi('ความพร้อมเฉลี่ย', avg + '%', 'readiness', avg >= 80 ? 'green' : 'pink')}
    </div>

    <div class="tr22">
      <div>
        <div class="tr22-toolbar">
          <button class="tr22-chip active" type="button" onclick="tr22Filter(this,'all')">ทั้งหมด (${rs.length})</button>
          <button class="tr22-chip" type="button" onclick="tr22Filter(this,'ภายใน')">ภายใน</button>
          <button class="tr22-chip" type="button" onclick="tr22Filter(this,'ภายนอก')">ภายนอก</button>
          <button class="tr22-chip" type="button" onclick="tr22Filter(this,'รอ')">รออนุมัติ (${waiting})</button>
          <button class="tr22-chip" type="button" onclick="tr22Filter(this,'พร้อมเปิด')">พร้อมเปิด (${ready})</button>
          <button class="tr22-new" type="button" onclick="navigateTo('training-2-1')">+ สร้างคำขอ</button>
        </div>
        <div class="tr22-list">${rs.map(tr22Card).join('')}</div>
      </div>

      <aside class="tr22-side">
        <h4 style="margin-top:0">มุมมองอนุมัติ</h4>
        <div class="tr22-flow">
          ${step('รับคำขอ', 'PAD ตรวจข้อมูลเบื้องต้น', 'done')}
          ${step('ตรวจความพร้อม', 'หลักสูตร/วิทยากร/รายชื่อ/ห้อง/งบ', 'active')}
          ${step('ส่งอนุมัติ', 'Manager หรือ HRBP ตามประเภทอบรม', '')}
          ${step('เปิดรุ่นอบรม', 'สร้างรอบและแจ้งผู้เรียน', '')}
        </div>
        <div class="tr22-hr"></div>
        <h4>ข้อมูลที่ฟอร์ม 2.2 ต้องมี</h4>
        <div class="tr22-cloud">
          ${['ชื่อหลักสูตร','ประเภทอบรม','BU','วันที่','สถานที่','จำนวนผู้เรียน','วิทยากร','งบประมาณ','ผู้ขอ','วัตถุประสงค์'].map(f => `<span>${f}</span>`).join('')}
        </div>
        <div class="tr22-hr"></div>
        <h4>กติกาแจ้งเตือน</h4>
        <ul class="tr22-rules">
          <li>Readiness ต่ำกว่า 60% ให้ติดป้ายแบบร่าง</li>
          <li>อบรมภายนอกต้องมีงบและ provider ก่อนส่งอนุมัติ</li>
          <li>รายการพร้อมเปิดต้องไม่มี blocker ค้าง</li>
        </ul>
      </aside>
    </div>`;
}
</script>

function classifyKpi(label) {
  const l = label.toLowerCase();
  if (l.includes('ครบ') || l.includes('ผ่าน') || l.includes('บรรลุ')) return 'good';
  if (l.includes('รอ') || l.includes('ไม่บรรลุ') || l.includes('น้อยกว่า')) return 'warn';
  if (l.includes('วิกฤต') || l.includes('ยังไม่บรรลุ')) return 'bad';
  return 'info';
}

function renderKpiGrid(elementId, items) {
  const grid = document.getElementById(elementId);
  if (!grid) return;
  grid.innerHTML = items.map(item => {
    const cls = classifyKpi(item.label);
    return `<div class="kpi-item ${cls}">
      <div class="k-label">${item.label}</div>
      <div class="k-value">${item.value}</div>
      <div class="k-unit">${item.unit || ''}</div>
    </div>`;
  }).join('');
}

function parseCsv(text) {
  const lines = text.trim().split('\n');
  return lines.map(line => {
    // Simple CSV parser (handle quoted fields with commas)
    const result = []; let cur = ''; let inQuote = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { inQuote = !inQuote; }
      else if (c === ',' && !inQuote) { result.push(cur.trim()); cur = ''; }
      else { cur += c; }
    }
    result.push(cur.trim());
    return result;
  });
}

function pctToNum(s) { return parseFloat(String(s).replace('%', '')) || 0; }

async function fetchSheetData() {
  const dataSource = document.getElementById('dataSource');
  try {
    const res = await fetch(SHEET_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const csv = await res.text();
    const rows = parseCsv(csv);
    // Skip header rows (rows 1-2 are headers/multiline, real data starts at row 3)
    // Include รวม row (summary) — do NOT filter it out
    const dataRows = rows.slice(2).filter(r => {
      const name = (r[0] || '').replace(/\s+/g, '').trim();
      return name && name.length > 0 && !name.startsWith('เป้าหมาย');
    });
    const companies = dataRows.map(r => ({
      name: (r[0] || '').replace(/\s+/g, ' ').trim(),
      members: parseInt(r[5]) || 0,                    // F: จำนวนสมาชิก
      credit_done: parseInt(r[6]) || 0,               // G: ครบ 44 หน่วย/คน
      credit_remain: parseInt(r[7]) || 0,             // H: ยังไม่ครบ/คน
      credit_pct: pctToNum(r[8]),                     // I: % ครบหน่วยกิต
      gpa_pass: parseInt(r[9]) || 0,                  // J: GPA ผ่าน 3.5/คน
      gpa_fail: parseInt(r[10]) || 0,                 // K: GPA ไม่ผ่าน
      gpa_pct: pctToNum(r[11]),                       // L: % GPA
      training_goal: parseInt(r[1]) || 0,             // B: เป้าหมายฝึกอบรม
      training_done: parseInt(r[2]) || 0,             // C: เสร็จ
      training_remain: parseInt(r[3]) || 0,           // D: รออบรม
      training_pct: pctToNum(r[4])                    // E: % อบรม
    }));
    const companyCount = companies.filter(c => (c.name || '').trim() !== 'รวม').length;
    if (dataSource) dataSource.innerHTML = `🧪 TEST DATA · ข้อมูลสังเคราะห์ ไม่ใช่ข้อมูลจริง`;
    return companies;
  } catch (e) {
    if (dataSource) dataSource.innerHTML = `❌ โหลดไม่สำเร็จ — ใช้ข้อมูล fallback (${e.message})`;
    return null;
  }
}

function renderSummaryKpi(companies) {
  const grid = document.getElementById('summaryKpiGrid');
  if (!grid || !companies) return;
  // Exclude "รวม" row from KPI calculation (avoid double-counting)
  const companyOnly = companies.filter(c => (c.name || '').trim() !== 'รวม');
  const totalMembers = companyOnly.reduce((s, c) => s + c.members, 0);
  const totalCreditDone = companyOnly.reduce((s, c) => s + c.credit_done, 0);
  const totalCreditGoal = totalCreditDone + companyOnly.reduce((s, c) => s + c.credit_remain, 0);
  const overallCreditPct = totalCreditGoal > 0 ? (totalCreditDone / totalCreditGoal) * 100 : 0;
  const totalGpaPass = companyOnly.reduce((s, c) => s + c.gpa_pass, 0);
  const totalGpaGoal = totalGpaPass + companyOnly.reduce((s, c) => s + c.gpa_fail, 0);
  const overallGpaPct = totalGpaGoal > 0 ? (totalGpaPass / totalGpaGoal) * 100 : 0;
  const totalTrainingDone = companyOnly.reduce((s, c) => s + c.training_done, 0);
  const totalTrainingGoal = totalTrainingDone + companyOnly.reduce((s, c) => s + c.training_remain, 0);
  const overallTrainingPct = totalTrainingGoal > 0 ? (totalTrainingDone / totalTrainingGoal) * 100 : 0;

  // Build 4 donut charts (C: Multi-segment filled vs empty)
  const pieSize = 140;
  const radius = 50;
  const cx = pieSize / 2, cy = pieSize / 2;
  const strokeWidth = 20;
  const circumference = 2 * Math.PI * radius;

  function pieSvg(pct, color1, color2, gid) {
    const filled = (Math.min(pct, 100) / 100) * circumference;
    const empty = circumference - filled;
    return `
      <svg class="pie-svg" viewBox="0 0 ${pieSize} ${pieSize}">
        <defs>
          <linearGradient id="grad-${gid}" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="${color1}"/>
            <stop offset="100%" stop-color="${color2}"/>
          </linearGradient>
        </defs>
        <!-- Empty segment (faded) -->
        <circle cx="${cx}" cy="${cy}" r="${radius}" fill="none"
          stroke="url(#grad-${gid})" stroke-width="${strokeWidth}"
          stroke-dasharray="0 ${filled} ${empty}" stroke-dashoffset="${filled/2}"
          opacity="0.2"
          transform="rotate(90 ${cx} ${cy})"/>
        <!-- Filled segment -->
        <circle cx="${cx}" cy="${cy}" r="${radius}" fill="none"
          stroke="url(#grad-${gid})" stroke-width="${strokeWidth}"
          stroke-dasharray="${filled} ${empty}" stroke-linecap="butt"
          transform="rotate(-90 ${cx} ${cy})"/>
        <text x="${cx}" y="${cy + 8}" text-anchor="middle" font-size="22" font-weight="800"
          fill="${color1}" font-family="Inter, sans-serif">${pct.toFixed(0)}%</text>
      </svg>`;
  }

  const buCount = companyOnly.filter(c => c.members > 0).length;

  grid.className = 'pie-grid';
  grid.innerHTML = `
    <div class="pie-card c1">
      ${pieSvg(100, '#FF8C00', '#FBBF24', 'members')}
      <div class="pie-label">สมาชิกทั้งหมด</div>
      <div class="pie-detail"><i class="fa-solid fa-building"></i> ${totalMembers} คน · ${buCount} BU</div>
    </div>
    <div class="pie-card c2">
      ${pieSvg(overallTrainingPct, '#22C55E', '#84CC16', 'training')}
      <div class="pie-label">ผ่านการอบรม</div>
      <div class="pie-detail"><i class="fa-solid fa-arrow-up"></i> ${totalTrainingDone}/${totalTrainingGoal} หลักสูตร</div>
    </div>
    <div class="pie-card c3">
      ${pieSvg(overallCreditPct, '#3B82F6', '#06B6D4', 'credit')}
      <div class="pie-label">ครบ 44 หน่วยกิต</div>
      <div class="pie-detail"><i class="fa-solid fa-arrow-up"></i> ${totalCreditDone}/${totalCreditGoal} คน</div>
    </div>
    <div class="pie-card c4">
      ${pieSvg(overallGpaPct, '#9333EA', '#EC4899', 'gpa')}
      <div class="pie-label">GPA ผ่าน 3.5</div>
      <div class="pie-detail"><i class="fa-solid fa-arrow-up"></i> ${totalGpaPass}/${totalGpaGoal} คน</div>
    </div>
  `;
}

const DONUT_SIZE = 110;
const DONUT_RADIUS = 44;
const DONUT_CX = DONUT_SIZE / 2, DONUT_CY = DONUT_SIZE / 2;
const DONUT_STROKE = 18;
const DONUT_CIRC = 2 * Math.PI * DONUT_RADIUS;

function donutSvg(pct, color1, color2, gid) {
  const filled = (Math.min(pct, 100) / 100) * DONUT_CIRC;
  const empty = DONUT_CIRC - filled;
  return `
    <svg class="donut-chart" viewBox="0 0 ${DONUT_SIZE} ${DONUT_SIZE}">
      <defs>
        <linearGradient id="grad-${gid}" x1="0%" y1="0%" x2="100%" y2="100%">

        </linearGradient>
      </defs>
      <circle cx="${DONUT_CX}" cy="${DONUT_CY}" r="${DONUT_RADIUS}" fill="none"
        stroke="url(#grad-${gid})" stroke-width="${DONUT_STROKE}"
        stroke-dasharray="0 ${filled} ${empty}" stroke-dashoffset="${filled/2}"
        opacity="0.2"
        transform="rotate(90 ${DONUT_CX} ${DONUT_CY})"/>
      <circle cx="${DONUT_CX}" cy="${DONUT_CY}" r="${DONUT_RADIUS}" fill="none"
        stroke="url(#grad-${gid})" stroke-width="${DONUT_STROKE}"
        stroke-dasharray="${filled} ${empty}" stroke-linecap="butt"
        transform="rotate(-90 ${DONUT_CX} ${DONUT_CY})"/>
      <text x="${DONUT_CX}" y="${DONUT_CY + 6}" text-anchor="middle" font-size="16" font-weight="800"
        fill="${color1}" font-family="Inter, sans-serif">${pct.toFixed(0)}%</text>
    </svg>`;
}

// Real-time Clock (Asia/Bangkok)

function updateRealtimeClock() {
  const now = new Date();
  const opts = {
    timeZone: 'Asia/Bangkok',
    year: 'numeric', month: 'long', day: 'numeric',
    hour: '2-digit', minute: '2-digit', second: '2-digit',
    hour12: false
  };
  const fmt = new Intl.DateTimeFormat('th-TH', opts);
  const parts = fmt.formatToParts(now);
  const get = (type) => parts.find(p => p.type === type)?.value || '';
  const day = get('day');
  const month = get('month');
  const year = get('year'); // th-TH locale แสดงเป็น พ.ศ. อยู่แล้ว (เช่น 2569)
  const hour = get('hour');
  const minute = get('minute');
  const second = get('second');
  const text = `${day} ${month} ${year} เวลา ${hour}:${minute}:${second} น.`;
  const ts = document.getElementById('timestamp');
  const ft = document.getElementById('footerTimestamp');
  if (ts) ts.textContent = text;
  if (ft) ft.textContent = text;
}

  const items = window.MENU_CONFIG.filter(m => allowed.includes(m.id));
  
  // หา parent menus ที่มีลูกใน allowed
  const parentsNeeded = new Set();
  items.forEach(m => { if (m.parent) parentsNeeded.add(m.parent); });
  const parents = window.MENU_CONFIG.filter(m => parentsNeeded.has(m.id) && !m.parent);
  
  let html = '';
  
  // 1. Dashboard (top-level button)
  const dashboard = window.MENU_CONFIG.find(m => m.id === 'dashboard');

      <i class="fa-solid ${dashboard.icon}"></i>
      <span>${dashboard.label}</span>

  }
  
  // 2. Parent sections + sub-items
  parents.forEach(parent => {
    // Section header (ไม่กด)
    html += `<div class="menu-section-title">
      <i class="fa-solid ${parent.icon}"></i> ${parent.label}
    </div>`;

async function submitForm(event, formId) {
  event.preventDefault();
  const form = document.getElementById(formId);
  if (!form) return;
  const status = document.getElementById('formStatus');

  // Collect form data
  const formData = new FormData(form);
  const data = {};
  formData.forEach((value, key) => { data[key] = value; });

  // แสดงสถานะกำลังบันทึก
  if (status) {
    status.className = 'form-status info';
    status.style.display = 'block';
    status.innerHTML = '<i class="fa-solid fa-circle-info"></i> กำลังส่งข้อมูลไป Google Sheet...';
  }

  // ถ้ายังไม่ได้ใส่ URL → โหมดจำลอง
  if (!WEB_APP_URL || WEB_APP_URL === 'PASTE_YOUR_GAS_WEB_APP_URL_HERE') {
    setTimeout(() => {
      if (status) {
        status.className = 'form-status warning';
        status.innerHTML = `
          <i class="fa-solid fa-triangle-exclamation"></i>
          <strong>โหมดจำลอง!</strong><br>
          <small>⚠️ ยังไม่ได้เชื่อม Google Sheet — ดูวิธี Deploy ที่ไฟล์ <code>DEPLOY.md</code> แล้ว paste URL ที่ <code>WEB_APP_URL</code></small><br>
          <small>📋 ข้อมูลที่จะส่ง: <code>${JSON.stringify(data, null, 2)}</code></small>
        `;
      }
      console.log('Form data (mock):', data);
    }, 500);
    return;
  }

  // ส่ง POST จริงไป Apps Script
  try {
    const res = await fetch(WEB_APP_URL, {
      method: 'POST',
      mode: 'cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },  // GAS ต้องการ text/plain เพื่อหลีกเลี่ยง CORS preflight
      body: JSON.stringify({ action: 'append', fields: data })
    });

    if (!res.ok) throw new Error('HTTP ' + res.status);

    const result = await res.json();

    if (result.ok) {
      if (status) {
        status.className = 'form-status success';
        status.innerHTML = `
          <i class="fa-solid fa-circle-check"></i>
          <strong>บันทึกสำเร็จ!</strong><br>
          <small>✅ Row #${result.row} ใน Sheet: <a href="${result.sheetUrl}" target="_blank">${result.sheetName}</a></small><br>
          <small>🕐 ${new Date(result.timestamp).toLocaleString('th-TH')}</small><br>
          <small>👤 ${data.firstName} ${data.lastName} (${data.producerId})</small>
        `;
      }
      // Reset form หลังบันทึกสำเร็จ (optional)
      setTimeout(() => resetForm(formId), 3000);
    } else {
      throw new Error(result.error || 'Unknown error');
    }
  } catch (err) {
    if (status) {
      status.className = 'form-status error';
      status.innerHTML = `
        <i class="fa-solid fa-circle-xmark"></i>
        <strong>บันทึกไม่สำเร็จ!</strong><br>
        <small>❌ ${err.message}</small><br>
        <small>💡 ตรวจสอบ WEB_APP_URL หรือลอง Deploy Apps Script ใหม่</small>
      `;
    }
    console.error('Submit error:', err);
  }
}

const EMPLOYEE_SHEET_CSV = '../test-data/employee.csv';

let employeeMap = null;     // Map: id -> { firstName, lastName }

/** Parse CSV line — รองรับ comma ใน quoted fields */
function parseCSVLine(line) {
  const result = [];
  let cur = '';
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') { inQuotes = !inQuotes; continue; }
    if (ch === ',' && !inQuotes) { result.push(cur); cur = ''; continue; }
    cur += ch;
  }
  result.push(cur);
  return result;
}

/** สร้าง Map จาก CSV text */
function buildMapFromCSV(csv, source) {
  const map = new Map();
  const lines = csv.split('\n');
  for (let i = 1; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;
    const cols = parseCSVLine(line);
    if (cols.length < 3) continue;
    const id = cols[0].trim();
    const firstName = (cols[1] || '').trim();
    const lastName = (cols[2] || '').trim();
    if (id && (firstName || lastName)) {
      map.set(id, { firstName, lastName });
      if (/^\d+$/.test(id)) map.set('M-' + id.padStart(5, '0'), { firstName, lastName });
    }
  }
  console.log(`✅ โหลดสมาชิกจาก ${source}: ${map.size} รายการ`);
  return map;
}

async function loadEmployeeMap(forceReload = false) {
  if (!forceReload && employeeMap && employeeMap.size > 0) return employeeMap;
  if (!forceReload && employeeLoading) return employeeLoading;
  employeeLoadingStatus = 'loading';
  employeeLoading = (async () => {
    // Helper: try fetch URL
    async function tryFetch(url, source) {
      const res = await fetch(url, { method: 'GET', cache: 'no-cache' });
      if (!res.ok) throw new Error(source + ' HTTP ' + res.status);
      const csv = await res.text();
      if (!csv || csv.length < 100) throw new Error(source + ' empty (' + csv.length + ' bytes)');
      return csv;
    }
    // ⭐ Level 1: Primary (gviz/tq)
    try {
      const csv = await tryFetch(EMPLOYEE_SHEET_CSV, 'gviz/tq');
      employeeMap = buildMapFromCSV(csv, 'gviz/tq');
      employeeLoadingStatus = 'ready';
      console.log('🔍 6006083 →', employeeMap.get('6006083'));
      console.log('✅ Auto-fill ใช้งานได้ — ข้อมูลสดจาก Sheet');
      return employeeMap;
    } catch (e1) {
      console.warn('⚠️ Primary failed:', e1.message);
      // ⭐ Level 2: Fallback (allorigins.win)
      try {
        const csv = await tryFetch(EMPLOYEE_SHEET_CSV_FALLBACK, 'allorigins.win');
        employeeMap = buildMapFromCSV(csv, 'allorigins.win');
        employeeLoadingStatus = 'ready';
        console.log('🔍 6006083 (fallback) →', employeeMap.get('6006083'));
        console.log('✅ Auto-fill ใช้งานได้ — ผ่าน proxy');
        return employeeMap;
      } catch (e2) {
        console.warn('⚠️ Fallback failed:', e2.message);
        // ⭐ Level 3: Embedded (always works — last resort)
        try {
          if (typeof EMPLOYEE_EMBEDDED_CSV === 'string' && EMPLOYEE_EMBEDDED_CSV.length > 100) {
            employeeMap = buildMapFromCSV(EMPLOYEE_EMBEDDED_CSV, 'embedded');
            employeeLoadingStatus = 'ready';
            console.log('🔍 6006083 (embedded) →', employeeMap.get('6006083'));
            console.log('✅ Auto-fill ใช้งานได้ — embedded data (' + employeeMap.size + ' รายการ)');
            return employeeMap;
          }
          throw new Error('No embedded data');
        } catch (e3) {
          console.error('❌ โหลดข้อมูลสมาชิกล้มเหลวทั้ง 3 วิธี:', e1.message, '/', e2.message, '/', e3.message);
          employeeLoadingStatus = 'failed';
          employeeMap = new Map();
          return employeeMap;
        }
      }
    }
  })();
  return employeeLoading;
}

// ⭐ Preload map ทันทีตอนหน้า load (ไม่ต้องรอ user เปิดฟอร์ม)
window.addEventListener('DOMContentLoaded', () => {
  console.log('🚀 Preload employee map...');
  loadEmployeeMap();
});


// ⭐ Retry function — เรียกจาก UI ถ้า user กดปุ่ม "ลองใหม่"
async function retryLoadEmployeeMap() {
  employeeMap = null;
  employeeLoading = null;
  employeeLoadingStatus = 'idle';
  console.log('🔄 Retry loading employee map...');
  const map = await loadEmployeeMap(true);
  if (map && map.size > 0) {
    // Re-trigger auto-fill ถ้ามีค่าอยู่ใน producerId
    autoFillName();
    return true;
  }
  return false;
}

// ⭐ Expose to window for console debugging
window.retryLoadEmployeeMap = retryLoadEmployeeMap;
window.loadEmployeeMap = loadEmployeeMap;

async function autoFillName() {
  const producerId = document.getElementById('producerId');
  const firstName = document.getElementById('firstName');
  const lastName = document.getElementById('lastName');
  if (!producerId || !firstName || !lastName) return;
  const id = producerId.value.trim();
  if (!id) {
    firstName.value = '';
    lastName.value = '';
    firstName.placeholder = 'กรอกรหัสสมาชิกก่อน';
    lastName.placeholder = 'กรอกรหัสสมาชิกก่อน';
    firstName.style.background = '#f0f9ff';
    lastName.style.background = '#f0f9ff';
    return;
  }
  // แสดงสถานะกำลังโหลด
  firstName.placeholder = '⏳ กำลังค้นหา...';
  lastName.placeholder = '⏳ กำลังค้นหา...';
  const map = await loadEmployeeMap();
  // ลองหาแบบตรงๆ ก่อน, ถ้าไม่เจอลอง strip non-digit
  let emp = map.get(id);
  if (!emp) {
    const digits = id.replace(/\D/g, '');
    if (digits) {
      emp = map.get(digits) || map.get('M-' + digits.padStart(5, '0'));
    }
  }
  console.log('🔍 ค้นหา ID:', id, '→', emp ? `เจอ: ${emp.firstName} ${emp.lastName}` : 'ไม่เจอ (map size=' + map.size + ', status=' + employeeLoadingStatus + ')');
  if (emp) {
    firstName.value = emp.firstName;
    lastName.value = emp.lastName;
    firstName.placeholder = '';
    lastName.placeholder = '';
    // ⭐ Visual feedback: highlight + pulse
    firstName.style.background = '#d1fae5';
    lastName.style.background = '#d1fae5';
    firstName.style.color = '#065f46';
    lastName.style.color = '#065f46';
    firstName.style.fontWeight = '600';
    lastName.style.fontWeight = '600';
    setTimeout(() => {
      firstName.style.background = '#f0f9ff';
      lastName.style.background = '#f0f9ff';
    }, 1500);
  } else {
    firstName.value = '';
    lastName.value = '';
    if (employeeLoadingStatus === 'loading') {
      firstName.placeholder = '⏳ กำลังโหลดข้อมูล...';
      lastName.placeholder = '⏳ กำลังโหลดข้อมูล...';
    } else if (employeeLoadingStatus === 'failed') {
      firstName.placeholder = '❌ โหลดข้อมูลล้มเหลว — ติดต่อตี๋';
      lastName.placeholder = '❌ โหลดข้อมูลล้มเหลว — ติดต่อตี๋';
    } else {
      firstName.placeholder = '❌ ไม่พบรหัส ' + id;
      lastName.placeholder = '❌ ไม่พบรหัส ' + id;
    }
    firstName.style.background = '#fee2e2';
    lastName.style.background = '#fee2e2';
  }
}

// === Event: ผูกกับ document เพื่อจับทุก event (รวม input ขณะพิมพ์) ===
document.addEventListener('input', (e) => {
  if (e.target && e.target.id === 'producerId') autoFillName();
});
document.addEventListener('change', (e) => {
  if (e.target && e.target.id === 'producerId') autoFillName();
});
document.addEventListener('blur', (e) => {
  if (e.target && e.target.id === 'producerId') autoFillName();
}, true);
// Backward-compat: ผูกตอน DOMContentLoaded
document.addEventListener('DOMContentLoaded', () => {
  const producerId = document.getElementById('producerId');
  if (producerId) {
    producerId.addEventListener('blur', autoFillName);
    producerId.addEventListener('change', autoFillName);
  }
});

// === Role Change ===
function onRoleChange(role) {
  currentUser.role = role;
  const roleNames = { admin: 'ผู้ดูแลระบบ (Admin)', manager: 'ผู้จัดการ (Manager)', member: 'สมาชิก (Member)' };
  currentUser.name = roleNames[role] || role;
  const userName = document.querySelector('.user-name');
  if (userName) userName.textContent = currentUser.name;
  renderMenu();
  // กลับไปหน้า dashboard เมื่อเปลี่ยนสิทธิ์
  navigateTo('dashboard');
}

// === Init Menu on Load ===
renderMenu();
navigateTo('dashboard');

loadData();
updateRealtimeClock();
setInterval(updateRealtimeClock, 1000);
</script>
